[package]
name = "knos-near"
version = "0.1.0"
edition = "2021"
description = "A funded research milestone on NEAR: paid on a GitHub Actions OIDC token verified in the contract, refunded after its deadline"
license = "MIT"
repository = "https://github.com/drexthealpha/Knos"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.30.0", features = ["unstable"] }   # env::ecrecover (Round 11, W4)
near-contract-standards = "=5.30.0"
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
near-sdk = { version = "=5.30.0", features = ["unit-testing", "unstable"] }
rsa = { version = "0.9", features = ["sha2"] }
sha2 = "0.10"
rand = "0.8"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

# the test key is made at run time; optimised dependencies keep that to seconds
[profile.dev.package."*"]
opt-level = 3
