[package]
name = "knos-near-sandbox"
version = "0.1.0"
edition = "2021"
description = "Sandbox tests for knos-near: the contract and a NEP-141 test token on a local near-sandbox node"
license = "MIT"
publish = false

[dev-dependencies]
base64 = "0.22"
serde_json = "1"
rsa = { version = "0.9", features = ["sha2"] }
sha2 = "0.10"
rand = "0.8"
near-sandbox = "=0.4.0"
near-api = "=0.8.0"
near-api-types = "=0.8.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[profile.dev.package."*"]
opt-level = 3
