[package]
name = "knos-market"
version = "0.1.0"
edition = "2021"
description = "A yes/no claim market priced by Hanson's LMSR (b = 100 test tokens), settled only by the claim's locked check on chain"
license = "MIT"
repository = "https://github.com/drexthealpha/Knos"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.30.0"
near-contract-standards = "=5.30.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
near-sdk = { version = "=5.30.0", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
