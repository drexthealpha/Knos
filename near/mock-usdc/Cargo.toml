[package]
name = "knos-mock-usdc"
version = "0.1.0"
edition = "2021"
description = "A NEP-141 test token with 6 decimals, standing in for USDC in the sandbox tests only"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.30.0"
near-contract-standards = "=5.30.0"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
