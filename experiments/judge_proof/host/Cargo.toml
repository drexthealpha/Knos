[package]
name = "judge-host"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"

[workspace]

[dependencies]
# the default features: the proof is made by the r0vm binary of the same release, found through RISC0_SERVER_PATH;
# verification is done here, in this process, by the library
risc0-zkvm = { version = "=3.0.6" }
risc0-binfmt = "3.0.5"
risc0-zkos-v1compat = "2.2.3"
bincode = "1.3"
sha2 = "0.10"
hex = "0.4"
anyhow = "1"
