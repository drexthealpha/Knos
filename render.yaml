# Render blueprint: Knos's demand check (apps/wanted) as one free web service, built from this repository's main.
# Secrets are set on Render, never here: QLOO_API_KEY (env) and the devnet TEST keys as secret files under /etc/secrets.
services:
  - type: web
    name: knos
    runtime: docker
    plan: free
    dockerfilePath: apps/wanted/Dockerfile
    dockerContext: .
    branch: main
    healthCheckPath: /healthz
    envVars:
      - key: QLOO_API_KEY
        sync: false
      - key: QLOO_BASE_URL
        sync: false
      - key: QLOO_MONTHLY_BUDGET
        value: "8000"
      - key: KNOS_CLUSTER
        value: devnet
      - key: KNOS_PRIORITY            # knos.platform.priority: a priority fee from getRecentPrioritizationFees, a limit from simulateTransaction
        value: auto
      - key: KNOS_WS                  # confirmations by signatureSubscribe, not polling
        value: "1"
      - key: KNOS_WANTED_TRUST_PROXY
        value: "1"
      - key: KNOS_WANTED_RP_ID
        value: knos.onrender.com
      - key: KNOS_WANTED_DEVNET_KEYPAIR
        value: /etc/secrets/buyer.json
      - key: KNOS_WANTED_RELAYER_KEYPAIR
        value: /etc/secrets/relayer.json
      - key: KNOS_WANTED_REFEREE_KEYS
        value: /etc/secrets/panel.json
      # referee host 1 of the FROST 2-of-3 group (knos_wanted.referee): this server's ONE key share, a secret file
      - key: KNOS_REFEREE_FROST_SHARE
        value: /etc/secrets/referee-frost-share.json
      # host 2 (.github/workflows/referee.yml) needs no token here: it polls on a cron and proves itself with its
      # GitHub Actions OIDC token, which this server verifies against GitHub's keys (knos.threshold.ghoidc)
      - key: KNOS_WANTED_MAKER_WALLET
        value: 4dFAUoXNDbmPCJ1CPCFyaJqLW5WWY3i2TE3VKEdSbC31
      - key: KNOS_WANTED_SESSION_SECRET
        generateValue: true
      # sign-in providers: each switches on only when set (the page shows only configured ones)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ORCID_CLIENT_ID
        sync: false
      - key: ORCID_CLIENT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: KNOS_WANTED_EMAIL_FROM
        sync: false
      - key: KNOS_WANTED_MINT
        sync: false
      # SAML single sign-on: KNOS_SSO_URL (a SAML Jackson service) is set by hand when one runs; this blueprint defines none
      - key: KNOS_SSO_TEST_TENANT
        value: knos-test
      - key: KNOS_SSO_API_KEY
        sync: false
      - key: KNOS_SSO_CLIENT_SECRET
        sync: false
      # the self-hosted Keycloak TEST realm (deploy/sso/keycloak), when one runs: tenant knos-keycloak is then registered itself
      - key: KNOS_SSO_KEYCLOAK_URL
        sync: false
