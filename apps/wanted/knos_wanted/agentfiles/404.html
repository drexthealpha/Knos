<style>
:root{--paper:#F4F4F0;--ink:#15171C;--soft:#4A4D57;--accent:#2B3BB5;--line:#D9D9D2;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--paper:#15171C;--ink:#F4F4F0;--soft:#B4B6BE;--accent:#A9B2FF;--line:#30333B}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center}
main{width:100%;max-width:720px;margin:0 auto;padding:48px 16px}
h1{font-size:56px;line-height:1.06;letter-spacing:-0.03em;font-weight:600;margin:0 0 24px;text-wrap:balance}
nav{display:flex;flex-wrap:wrap;gap:12px}
a{display:inline-block;min-height:44px;padding:10px 20px;border-radius:999px;font-weight:600;text-decoration:none;border:1px solid var(--line);color:var(--ink)}
a.go{background:var(--accent);border-color:var(--accent);color:var(--paper)}
a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
@media (max-width:480px){h1{font-size:40px}}
</style>
