[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knos-demand-check"
version = "0.3.33"
description = "Knos's demand check: an idea -> Qloo taste evidence (via qloo mcp) the maker confirms -> a demand report in the Knos Record -> pre-orders held on Knos's devnet until the proof passes. Directional demand evidence, not a sales forecast."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"   # the image runs python:3.12-slim; f-strings with nested quotes need 3.12
authors = [{ name = "drexthealpha" }]
dependencies = []   # the report and the web app use the Python standard library only

[project.optional-dependencies]
# the "lock pre-orders" button: Knos's graduation pre-order pool. This app is apps/wanted/ of the Knos monorepo:
# install Knos from the same checkout beside it (`pip install . "./apps/wanted[escrow]"` at the root), so the app and
# the escrow code are always one commit.
escrow = ["knos", "solders>=0.29"]
hold = ["knos", "solders>=0.29"]   # the same, under the name the README uses
config = ["pyyaml==6.0.3"]   # config/fees.yaml + config/referees.yaml on the money path (the uv.lock pin)
auth = ["cryptography>=42"]   # passkey sign-in (ES256 signature check)
evidence = ["c2pa-python==0.38.0"]   # C2PA-signed photo/video evidence (knos_wanted.provenance)
attest = ["sigstore==4.5.0"]   # the code referee's Sigstore attestation, checked against Sigstore's public trust root (knos.threshold.codeattest)
saml = ["signxml==5.1.0", "lxml==6.1.3"]   # Knos as the SAML service provider for the test IdPs (knos_wanted.saml_sp)
dev = ["pytest>=8"]

[project.scripts]
knos-demand-check = "knos_wanted.__main__:main"

[tool.setuptools]
packages = ["knos_wanted"]

[tool.setuptools.package-data]
knos_wanted = ["static/*", "static/brand/*", "static/fonts/*", "data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
