# The IRIS public edition from a fresh checkout, exactly as the README says: no InterSystems login, no key. It builds
# iris/docker-compose.public.yml on the public IRIS for Health Community image, waits for the ready check, presses the
# built-in demo's sample "A passing test, $20" and prints the decision it reached.
name: iris-public
on:
  push:
    branches: [main]
    paths: ["iris/**", "src/knos/**", ".github/workflows/iris-public.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency: {group: iris-public, cancel-in-progress: true}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: docker compose -f docker-compose.public.yml up -d --build
        working-directory: iris
        run: docker compose -f docker-compose.public.yml up -d --build
      - name: bash scripts/ready.sh (as the README runs it, with no password set)
        working-directory: iris
        run: bash scripts/ready.sh
      - name: the sample decision
        run: |
          curl -fsS -X POST -H 'Content-Type: application/json' -d '{}' http://localhost:52773/api/knosdemo/sample/pass
          for i in $(seq 1 24); do
            d=$(curl -fsS http://localhost:52773/api/knosdemo/decisions) && echo "$d" | grep -q '"decision"' && break
            sleep 5
          done
          echo "$d" | head -c 2000; echo
          echo "$d" | grep -q '"decision"'
      - name: the $120 sample waits for a person, then Approve pays it (README step 3)
        run: |
          curl -fsS -X POST -H 'Content-Type: application/json' -d '{}' http://localhost:52773/api/knosdemo/sample/big
          id=""
          for i in $(seq 1 24); do
            id=$(curl -fsS http://localhost:52773/api/knosdemo/tasks | jq -r '[.[] | select(.open)][0].id // empty') && [ -n "$id" ] && break
            sleep 5
          done
          echo "open task: $id"; [ -n "$id" ]
          curl -fsS -X POST -H 'Content-Type: application/json' -d '{"action":"Approve"}' "http://localhost:52773/api/knosdemo/tasks/$id"; echo
          for i in $(seq 1 24); do
            d=$(curl -fsS http://localhost:52773/api/knosdemo/tasks | jq -r --arg id "$id" '.[] | select((.id|tostring) == $id) | .action // empty') && [ "$d" = "Approve" ] && break
            sleep 5
          done
          echo "task $id: $d"; [ "$d" = "Approve" ]
          for i in $(seq 1 24); do
            p=$(curl -fsS http://localhost:52773/api/knosdemo/decisions | jq -r '[.[] | select(.outcome | test("simulat"))] | length') && [ "$p" -ge 2 ] && break
            sleep 5
          done
          echo "decisions paid in play money: $p"; [ "$p" -ge 2 ]
      - name: the portal shows Knos.Iris.Production to _SYSTEM with the public password (README step 4)
        run: |
          u="http://localhost:52773/csp/healthshare/knos/EnsPortal.ProductionConfig.zen?\$NAMESPACE=KNOS"
          curl -sS -c jar -b jar -o login.html -w "first: HTTP %{http_code}\n" "$u"
          grep -o "<title>[^<]*" login.html || true
          curl -sS -L -c jar -b jar -o portal.html -w "signed in: HTTP %{http_code}\n" -d "IRISUsername=_SYSTEM&IRISPassword=knos-public-demo&IRISLogin=Login" "$u"
          grep -o "<title>[^<]*" portal.html || true
          grep -q "Knos.Iris.Production" portal.html
      - name: the container's log
        if: always()
        working-directory: iris
        run: docker compose -f docker-compose.public.yml logs --tail 120 iris
  space:
    # the online demo's image (iris/space/make_space.py) built from this commit and run as a Hugging Face Docker Space
    # runs it: as user ID 1000, on port 52773, then the same sample
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: the Space's Dockerfile, at this commit
        run: python3 iris/space/make_space.py "$GITHUB_SHA" space
      - name: docker build (as the Space builds it)
        run: docker build -t knos-space space
      - name: docker run --user 1000 (as the Space runs it)
        run: |
          docker run -d --name knos-space --user 1000 -p 52773:52773 knos-space
          for i in $(seq 1 60); do curl -fsS -u _SYSTEM:knos-public-demo http://localhost:52773/api/knos/health && break; sleep 5; done
          echo
          curl -fsS -X POST -H 'Content-Type: application/json' -d '{}' http://localhost:52773/api/knosdemo/sample/pass
          for i in $(seq 1 24); do
            d=$(curl -fsS http://localhost:52773/api/knosdemo/decisions) && echo "$d" | grep -q '"decision"' && break
            sleep 5
          done
          echo "$d" | head -c 1500; echo
          echo "$d" | grep -q '"decision"'
          curl -fsS -o /dev/null -w "/knos/ %{http_code}\n" http://localhost:52773/knos/
      - name: the container's log
        if: always()
        run: docker logs --tail 150 knos-space || true
