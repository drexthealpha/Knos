name: agent-pr-index

# Two publications, each by a run that ends in under 30 minutes.
#
# 1. The Agent PR Index, by week: "Agent PR Index, week of <Monday>" (docs/INDEX.md has the method). Mondays.
#
#   week     samples the week that just ended and never reads longer than its budget: --max-requests 500 and
#            --max-minutes 20. The sample has a fixed design (docs/INDEX.md, "The sampling design"): each agent on each
#            day of the week is a stratum, the same number is drawn in each, in an order seeded by the ISO week, and
#            when the budget ends every stratum holds a prefix of its own order. Whatever was read is kept in a
#            checkpoint (week.json) after every request; a run that was cut starts from it. Its token can only read
#            (permissions: contents: read). It sends GET requests to GitHub's search and one read-only GraphQL query
#            for each 20 pull requests (their checks and merge state; REST GET requests when GraphQL is refused), and
#            it never fetches, checks out or runs a file of a sampled repository.
#   weekly   reads nothing from GitHub's API. It adds the week to docs/agent_weekly.json with its design, its counts
#            for each stratum and `capped: true|false`, writes the table into docs/INDEX.md and opens ONE pull request
#            (the branch index-weekly, replaced each time). A person merges it: nothing here pushes to the default
#            branch. A week is never refused for being incomplete: it is published as what it is.
#
#            Limits (re-read 2026-10-05): the search answers 30 requests a minute and 1,000 results a query
#            (docs.github.com/en/rest/search/search); the workflow's token has 1,000 REST requests and 1,000 GraphQL
#            points an hour (docs.github.com/en/rest/using-the-rest-api/rate-limits-for-the-rest-api,
#            docs.github.com/en/graphql/overview/rate-limits-and-query-limits-for-the-graphql-api). A run sends at
#            most 500 requests: searches 2.2 seconds apart (27 a minute), then GraphQL queries of 1 point each. It
#            never sleeps on a limit: a refusal ends the run, and what it has is published as capped.
#
#            Before 0.3.16 this job read the whole week, every hit: three to four REST requests a pull request against
#            1,000 an hour, sleeping whenever the hour was spent, behind the index job below. On 5 October 2026 it ran
#            for five hours, did not finish the week and published nothing.
#
# 2. index.json, every 6 hours: the asset of a GitHub Release tagged index-<date> (a release is not a data commit); the
#    Pages build (network.yml) downloads the newest one and re-checks its Merkle root.
#
#   scan     what GitHub already answered is in the Actions cache (search pages and CI verdicts), so a run reads only
#            what is new since the last one: the search windows are cut at fixed dates and do not move from day to day.
#            A run reads for 20 minutes at most. When the hourly API budget is spent it stops there.
#   gate     a scan that did not finish (a search out of time or refused, pull requests GitHub did not answer for) or
#            that shrank to under half of the last index is not published: the step fails, the last release stays
#            live, and the cache is saved all the same, so the next run continues where this one stopped. On an empty
#            cache that takes several runs: with the default token, 1,000 requests each.
#   release  everything else is published.
#
# KNOS_INDEX_TOKEN (a read-only PAT: 5,000 an hour) is optional, and only the index job sees it.
on:
  schedule:
    - cron: "17 */6 * * *"   # the index job
    - cron: "43 5 * * 1"     # Mondays: the week and weekly jobs
  workflow_dispatch:
    inputs:
      job:
        description: "week: sample last week and open its pull request. index: scan and release index.json."
        type: choice
        options: [week, index]
        default: week

permissions:
  contents: read

concurrency:
  group: agent-pr-index
  cancel-in-progress: false

jobs:
  index:
    if: ${{ github.event.schedule == '17 */6 * * *' || (github.event_name == 'workflow_dispatch' && inputs.job == 'index') }}
    runs-on: ubuntu-latest
    timeout-minutes: 28
    permissions:
      contents: write  # create the index-<date> release; nothing is committed
      actions: write   # start network.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: what GitHub already answered (search pages and CI verdicts)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/knos-agent-pr-ci
          key: agent-pr-ci-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: agent-pr-ci-
      - name: scan
        # up to 800 pull requests an agent; 1,200 s leaves the job's 28 minutes room to build, publish and save
        run: python scripts/agent_pr_index.py scan --rows rows.json --per-agent 800 --max-seconds 1200
        env:
          GH_TOKEN: ${{ secrets.KNOS_INDEX_TOKEN || github.token }}
      - name: keep the answers, whether or not the scan finished (the next run continues from them)
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/knos-agent-pr-ci
          key: agent-pr-ci-${{ github.run_id }}-${{ github.run_attempt }}
      - name: build index.json
        run: python scripts/agent_pr_index.py build --rows rows.json --out index.json
      - name: the same scan by agent and by week (reads whether each pull request with finished CI was merged)
        run: python scripts/agent_pr_index.py weekly --rows rows.json --out agent_weekly.json --max-seconds 180
        env:
          GH_TOKEN: ${{ secrets.KNOS_INDEX_TOKEN || github.token }}
      - name: gate (a scan that did not finish fails here and publishes nothing; the last release stays live)
        run: |
          last=$(gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
                 --jq '[.[] | select(.tagName | startswith("index-"))] | sort_by(.createdAt) | last | .tagName // empty')
          if [ -n "$last" ]; then gh release download "$last" -R "$GITHUB_REPOSITORY" -p index.json -O previous.json; fi
          python scripts/agent_pr_index.py gate --rows rows.json --out index.json --previous previous.json
        env:
          GH_TOKEN: ${{ github.token }}
      - name: release index-<date>
        run: |
          n=$(python -c "import json; print(json.load(open('index.json'))['n_prs'])")
          root=$(python -c "import json; print(json.load(open('index.json'))['root'])")
          tag="index-$(date -u +%Y-%m-%d-%H%M)"
          gh release create "$tag" index.json agent_weekly.json -R "$GITHUB_REPOSITORY" --title "Agent PR Index $tag" --latest=false \
            --notes "Agent PR Index: $n PRs, Merkle root $root. Recompute it: python scripts/agent_pr_index.py check --out index.json"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Pages build (a release made with GITHUB_TOKEN triggers no workflow, so start it explicitly)
        run: gh workflow run network.yml --ref main -R "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

  week:
    # Last week's sample, inside its budget. Read-only: this job's token cannot write anywhere, and the script only
    # asks GitHub's API. The checkpoint is saved whether or not the run finished, and handed to the next job.
    if: ${{ github.event.schedule == '43 5 * * 1' || (github.event_name == 'workflow_dispatch' && inputs.job != 'index') }}
    runs-on: ubuntu-latest
    timeout-minutes: 24
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: the checkpoint of this week's sample, when an earlier run was cut
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: week.json
          key: agent-pr-week-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: agent-pr-week-
      - name: sample the week (35 strata, 30 draws each, seeded by the ISO week; then checks and merge state)
        run: python scripts/agent_pr_index.py sample --week last --rows week.json --max-requests 500 --max-minutes 20
        env:
          GH_TOKEN: ${{ github.token }}
      - name: keep the checkpoint, whether or not the run finished
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: week.json
          key: agent-pr-week-${{ github.run_id }}-${{ github.run_attempt }}
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: week
          path: week.json
          if-no-files-found: error

  weekly:
    # Adds the week to docs/agent_weekly.json and writes the table into docs/INDEX.md, from the checkpoint alone: it
    # asks GitHub's API nothing and runs nothing but this repository's script on the counts. Whatever the sample
    # holds is published, marked capped when the budget cut it. It opens one pull request and merges nothing.
    needs: week
    if: ${{ always() && needs.week.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write        # push the branch index-weekly
      pull-requests: write   # open the pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: week
      - name: add the week to docs/agent_weekly.json and write its table into docs/INDEX.md
        run: python scripts/agent_pr_index.py weekly --rows week.json --into docs/agent_weekly.json --doc docs/INDEX.md
      - name: open one pull request when the numbers changed
        run: |
          if git diff --quiet -- docs/agent_weekly.json docs/INDEX.md; then echo "This week is already in docs/agent_weekly.json with the same numbers."; exit 0; fi
          week=$(python -c "import json; print(json.load(open('docs/agent_weekly.json', encoding='utf-8'))['latest_week'])")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B index-weekly
          git commit -m "Agent PR Index, week of $week" -- docs/agent_weekly.json docs/INDEX.md
          git push --force origin index-weekly
          gh pr create -R "$GITHUB_REPOSITORY" --head index-weekly --title "Agent PR Index, week of $week" \
            --body "One more week in docs/agent_weekly.json and the table in docs/INDEX.md: this run's sample, with its design, its counts for each stratum and whether the budget capped it. Method and limits: docs/INDEX.md." \
            || gh pr edit index-weekly -R "$GITHUB_REPOSITORY" --title "Agent PR Index, week of $week"
        env:
          GH_TOKEN: ${{ github.token }}
