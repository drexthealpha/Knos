name: claims

# One plain answer to a claim of payment where nothing was funded (src/knos/claim_guard.py).
#
# Pull requests arrive that carry the commands of bounty platforms (`/claim`, `/attempt`, `/opire try`) or a wallet on
# another chain, against an issue nobody funded: one "resolved" the issue the relay writes its log in. Knos pays only
# orders funded with `/knos fund`, on Solana devnet, in test USDC that has no monetary value. This job says so once
# (a hidden first line marks its comment, so a second event posts nothing), adds the label `no-order`, and does
# nothing else: it closes nothing, and it quotes no word of the claim.
#
# WHY THIS FILE HAS NO `pull_request_target` TRIGGER, though the claim it answers is usually a pull request from a fork:
#   - GitHub's guidance for that trigger (https://docs.github.com/en/actions/reference/security/securely-using-pull_request_target,
#     read 2026-10-06): give the token the least privileges and no secret it does not need, and make sure checked-out
#     code "is only ever inspected as data and never executed". The same page says that the default policy blocks
#     `pull_request_target` in public repositories and that "On November 2, 2026, GitHub will enforce the default
#     policy": a workflow started by it would stop running here a few weeks after it was written.
#   - actions/checkout v7 refuses to check out a fork's head under that trigger
#     (https://www.socket.dev/blog/github-actions-checkout-blocks-pull-request-target-checkouts): the pattern to avoid
#     is a privileged token beside a stranger's code.
#   - tests/test_workflows2.py holds every workflow of Knos to that: none is started by `pull_request_target`.
# So a pull request is answered by a SWEEP: the job lists the open issues and pull requests through the API and
# answers the ones that claim a payment and have no answer. Since 0.3.19 the always-on worker runs that sweep on
# its own passes, at most once in 5 minutes (worker.yml; knos.claim_guard.sweep_served), and the timer below is the
# FALLBACK for when no worker runs. A timer alone was not enough: in the 0.3.18 release run this 15-minute schedule
# did not fire once in 38 minutes. GitHub says scheduled workflows can be delayed when load is high and that a queued
# run can be dropped (https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#schedule,
# read 2026-10-07). A fork's own `pull_request` event
# carries a read-only token and could not comment; an event of the base repository can. Issues and comments are
# answered at once by their own events, which GitHub always runs from the default branch's copy of this file.
#
# What keeps it safe, whatever starts it:
#   - It checks out the default branch only, never a pull request's head, and runs only this repository's own code.
#   - A claim is read as data through the API: the event's file and the API's JSON. None of it reaches a shell (no
#     `${{ github.event... }}` in a `run:` line) and none of it reaches the comment, which is fixed text and issue
#     numbers the API confirmed.
#   - The token may read contents and write issues and pull requests (a comment, a label): nothing else. No secret
#     is named. No cache is read or written. Every action is a pinned commit; every package is installed by hash.
#   - Whether an issue is funded is read from Solana devnet (flow.py's own check). When the chain does not answer,
#     nothing is posted.
on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions: {}

# One run at a time for one issue or pull request, so that two events about it cannot both find it unanswered.
concurrency:
  group: claims-${{ github.event.issue.number || 'sweep' }}
  cancel-in-progress: false

jobs:
  answer:
    # Nothing is said to a bot or to whoever may write here; that is decided again in the code, which also reads the claim.
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'issues' && github.event.issue.user.type != 'Bot'
          && !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
      || (github.event_name == 'issue_comment' && github.event.comment.user.type != 'Bot'
          && !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read          # this repository's own code, at the default branch
      issues: write           # one comment, one label
      pull-requests: write    # the same on a pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.8.20"
          python-version: "3.12"
          enable-cache: false
      # PyPI's index can lag a release's upload, and uv may answer from what it read a moment before (0.3.23: the wait
      # for the file passed, and uv still said "no version of knos"). So the install itself is tried 3 times, the
      # second and third with --refresh (uv asks the index again), 10 then 30 s apart; the third failure ends the job.
      - name: install what the check needs, each by its hash, and nothing else
        run: |
          uv venv --no-config --python 3.12 "$RUNNER_TEMP/knos"
          refresh=""
          for nap in 10 30 end; do
            uv pip install --no-config $refresh --python "$RUNNER_TEMP/knos/bin/python" --require-hashes --no-deps --no-build -r requirements/sign.txt && break
            [ "$nap" != end ] || exit 1
            echo "The install failed: asking PyPI's index again (--refresh) in $nap s."
            refresh="--refresh"
            sleep "$nap"
          done
          echo "$RUNNER_TEMP/knos/bin" >> "$GITHUB_PATH"
      - name: answer a claim of payment that no funded order stands behind
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          if [ "$GITHUB_EVENT_NAME" = issues ] || [ "$GITHUB_EVENT_NAME" = issue_comment ]; then
            python -m knos.claim_guard --event "$GITHUB_EVENT_PATH" --event-name "$GITHUB_EVENT_NAME"
          else
            python -m knos.claim_guard --sweep
          fi
