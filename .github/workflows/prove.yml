name: knos prove

# A reusable workflow: everything after a bounty is funded. A repository's own knos.yml (examples/knos-workflow.yml)
# calls it. knos-pay (the second deployment) pays a bounty only on a GitHub Actions OIDC token from a file named
# prove.yml, of the repository and at the commit the bounty recorded when it was funded, on a GitHub-hosted runner,
# whose audience is
#
#     knos2:pay:<repository id>:<issue>:<payee's GitHub user id>:<head sha>:<terms hash>:<mode>:<address or ->
#
# Each job installs knos and runs one command. The commands hold the logic and are tested without GitHub.
#
#   settle   a push to the default branch, a run started by hand with a pull request's number, a `/knos settle` or
#            `/knos tip` comment on a pull request, or (an attestor, below) a timer:   knos settle
#            For each pull request the event merged or names: the issues it closes, their bounties on chain, the
#            terms as they were funded, GitHub's record of the merged head commit, who is paid and where. Only then
#            the token, its relay and a comment on the pull request. It checks out nothing and runs none of the pull
#            request's code.
#            THE COMMENT IS ONE, and it carries the five states of the payment (received, accepted, submitted,
#            confirmed, finalized; docs/RELAY.md): posted when the command has found something in escrow for the pull
#            request ("received"), edited when the terms hold and GitHub has signed ("accepted, settling": before the
#            token goes to Solana), edited again when the payment lands, and once more when it is finalized. Never a
#            new comment per state. No commit status or check is written on the merge commit: that needs
#            `statuses: write` or `checks: write`, this job has both as `read`, and a called job may not ask for
#            more than the calling job of every repository that installed Knos already grants.
#   review   the check on a pull request ("knos check", examples/knos-check.yml) has finished:   knos review
#            The same check again, where it may write: one comment on the pull request, edited in place on later
#            runs, and what was learned as comments on the issue labelled knos-memory. No id-token and no secret.
#            It checks out nothing; what it reads of the repository it reads through GitHub's API.
#   judge    after review, when the pull request closes an issue funded with acceptance checks
#            (.knos/acceptance/<issue>/ on the default branch):   knos proof judge ... --sandbox require
#            The only job that runs pull request code. So it has no id-token and no secret, its token can only read
#            the repository's contents and is not given to the step that runs that code, and it neither restores
#            nor saves a cache. The default branch and the pull request's head are laid side by side; the acceptance checks
#            must fail on the first and pass on the second, in the sandbox (another user, an empty environment, no
#            network while the tests run).
#   attest   after judge succeeded:   knos settle --tests, for that pull request, that head commit and that issue.
#            It has the id-token, checks out nothing and runs none of the pull request's code. From the judge job
#            it takes that the job succeeded and one line of JSON, the verdict, which it reads as data
#            (knos.verdict_gate: fixed keys, numbers and hashes, no free text): the verdict must be of this run, this
#            pull request, this issue and these two commits, and what GitHub's own record can settle is worked out
#            again here before anything is signed (the commit is the pull request's head; no changed path is one the
#            judge's rule refuses; the acceptance checks the judge hashed are the base commit's). Which pull request,
#            which commit and which issue come from review; who is paid, and whether the acceptance checks are the
#            ones that were funded, the command works out itself, from GitHub and the chain.
#            For a work order funded with `auto` the token it asks for has the audience
#                knos3:auto:<order>:<head sha>:<terms hash>:1:<pull request>:<the author's id>.10000.<address or ->
#            while the pull request is open: the funder chose, in the options the fund token signed, that the first
#            pull request this suite passes is paid with no merge, to its author (an agent's own account too). Any
#            other order paid by its acceptance checks gets the pay token (knos3:pay:...), as before. Both are posted
#            for the relay the same way. No job, event or permission is added for it: the split above is the same.
#
# How GitHub runs this, which the design rests on:
#   - A reusable workflow called from another repository sees the caller's event: `github.event`, the file at
#     $GITHUB_EVENT_PATH, `github.repository` and the job's token are all the calling repository's.
#   - A push runs the workflow file as it is at the pushed commit of the default branch. A merged pull request that
#     changed the calling knos.yml therefore changes what that very push runs. It cannot change what pays: the chain
#     takes a pay token only from this file at the commit the bounty recorded, and this file takes no inputs.
#   - A push made with a workflow's own token (GITHUB_TOKEN) starts no run at all: GitHub's rule against workflows
#     that start themselves. A merge made that way, or one whose commit message says [skip ci], is settled with
#     `/knos settle` on the pull request or by a run started by hand.
#   - `workflow_run` runs the default branch's copy of the calling file, in the calling repository's own context and
#     with its token, whatever the pull request contains. It is started by any workflow that carries the check's
#     name, and a pull request can add or change such a workflow, so the finished run proves nothing: none of its
#     artifacts, outputs or logs is read. The event only names a commit (`workflow_run.head_sha`), the repository
#     and branch it came from (`head_repository`, `head_branch`) and what started the check (`event`). For a pull
#     request from a fork `workflow_run.pull_requests` is empty, so the command finds the pull request itself and
#     asks GitHub whether that commit is its head.
#   - The check of a first-time contributor's pull request waits until a maintainer approves it. review runs only
#     when the check itself ran to an end (it concluded success or failure), which a check still waiting for
#     approval has not, so nothing here answers a pull request, and none of its code is judged, before that
#     approval.
#   - A `workflow_run` run uses the default branch's Actions cache. No job here restores or saves one
#     (`enable-cache: false`, and `cache-mode: read` on every job): the job that runs pull request code cannot
#     leave anything for a later job that signs, and none of the jobs that sign reads what an earlier run left.
#   - Comments on a pull request (`issue_comment`) run the default branch's file too, whoever commented. settle
#     takes a new comment only, never an edit.
#   - It takes no inputs: nothing a caller passes can change which code judges. A caller chooses when to call it,
#     and nothing else.
#   - In an organisation's ATTESTOR repository (examples/knos-attestor.yml; see fund.yml) settle also runs on a timer
#     (`schedule`) and by hand with a `repository`. The command tells such a run by its event and by the repository's
#     own .knos/policy.yml, reads the listed repositories through KNOS_READ_TOKEN without checking anything out, and
#     for each pull request merged there applies the rules it applies to a merge anywhere. The pay token names the
#     order and the accepted commit, and no repository, issue, pull request, branch or check: knos-pay takes it
#     because the run is in the repository the order named as its judge when it was funded.
#
# Both secrets are optional: see fund.yml. The install steps are fund.yml's (settle and attest install by hash; review
# and judge by release), and so is the reason none of them uses the Actions cache.
on:
  workflow_call:
    secrets:
      KNOS_RELAY_KEY:
        description: >-
          Optional. A Solana key that pays transaction fees, so this run carries its own token to Solana. Without it
          the token is posted as a comment and Knos's public relay carries it.
        required: false
      KNOS_READ_TOKEN:
        description: >-
          Optional, and only for an organisation's attestor repository (examples/knos-attestor.yml): a fine-grained
          token that reads the repositories the attestor's policy lists, and writes Knos's comments on their issues
          and pull requests. No other repository passes it, and without it this job reads only its own repository.
        required: false

permissions: {}

jobs:
  # ---- a merge, a replay by hand, /knos settle, /knos tip: the gate, then the proof. No pull request code. -----------
  settle:
    if: >-
      (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' ||
      (github.event_name == 'issue_comment' && github.event.action == 'created' && github.event.issue.pull_request)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # A push does not say which pull requests it merged, so a merge waits in the line of the commit it pushed: two
    # merges never wait for each other (a run holds its line until the relay has carried its token, so a merge that
    # waited for the one before it was paid that much later), and two runs of one commit run in turn. Runs started by
    # hand share one line, each in its turn (GitHub keeps up to 100 waiting). A comment waits in its own pull
    # request's line: anyone can write comments, and they must not be able to fill a line merges wait in. Should
    # two runs prove the same pull request, the chain pays it once.
    concurrency:
      group: ${{ github.event_name == 'issue_comment' && format('knos-settle-{0}', github.event.issue.number) || github.event_name == 'push' && format('knos-settle-push-{0}', github.sha) || 'knos-settle' }}
      queue: max
    cache-mode: read
    permissions:
      contents: read          # the repository's files, read through GitHub's API (there is no checkout)
      issues: write           # comments on the issue
      pull-requests: write    # the one comment on the pull request: posted at "received", edited as the payment moves
      checks: read            # GitHub's record of the merged head commit: the evidence (read: no check is written)
      statuses: read          # the same, for checks that report as commit statuses (read: no commit status is written)
      actions: read           # which workflow run each check belongs to
      id-token: write         # the pay token
    steps:
      - name: uv, with no cache
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.8.20"
          python-version: "3.12"
          enable-cache: false      # nothing is restored into a job that runs here, and nothing is saved from it
          ignore-empty-workdir: true
      - name: install knos and what it needs, each by its hash, and nothing else
        run: |
          uv venv --no-config --python 3.12 "$RUNNER_TEMP/knos"
          uv pip install --no-config --python "$RUNNER_TEMP/knos/bin/python" --require-hashes --no-deps --no-build -r - <<'LOCK'
          KNOS_LOCK
          LOCK
          echo "$RUNNER_TEMP/knos/bin" >> "$GITHUB_PATH"
      - name: knos settle
        env:
          GH_TOKEN: ${{ github.token }}
          KNOS_RELAY_KEY: ${{ secrets.KNOS_RELAY_KEY }}
          KNOS_READ_TOKEN: ${{ secrets.KNOS_READ_TOKEN }}
        run: knos settle --event "$GITHUB_EVENT_PATH" --repo "$GITHUB_REPOSITORY"

  # ---- the check on a pull request has finished: the same check, where it may comment and remember -------------------
  review:
    if: >-
      github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' &&
      (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # one review at a time for a pull request (the fork and its branch name it: the event has no number for a fork);
    # when several wait, the newest takes the place of the one before it
    concurrency:
      group: knos-review-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
    cache-mode: read
    permissions:
      contents: read          # CONTRIBUTING.md and .knos/ of the default branch, read through GitHub's API
      issues: write           # the knos-memory issue
      pull-requests: write    # the one comment on the pull request
      checks: read
      statuses: read
      actions: read
    outputs:
      tests: ${{ steps.review.outputs.tests }}    # the issue, when the pull request closes one funded with acceptance checks
      pull: ${{ steps.review.outputs.pull }}      # the pull request's number
      head: ${{ steps.review.outputs.head }}      # the pull request's head commit, as reviewed
    steps:
      - name: uv, with no cache
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.8.20"
          python-version: "3.12"
          enable-cache: false      # nothing is restored into a job that runs here, and nothing is saved from it
          ignore-empty-workdir: true
      - name: install knos, this one requirement exactly
        env:
          UV_EXCLUDE_NEWER: "2026-10-10T00:00:00Z"
        run: uv tool install --no-config "knos==0.3.19"
      - name: knos review
        id: review
        env:
          GH_TOKEN: ${{ github.token }}
        run: knos review --event "$GITHUB_EVENT_PATH" --repo "$GITHUB_REPOSITORY"

  # ---- tests mode: the funder's acceptance checks against the pull request. The one job that runs its code. ----------
  # THE BOUNDARY. This job is a separate GitHub-hosted virtual machine, with no id-token and no secret: a fresh machine for
  # this job alone, thrown away when it ends, that cannot ask GitHub to sign anything and holds nothing to steal. Its
  # token only reads the repository's contents and is not given to the step that runs the code. Two things leave it: its
  # success or failure, and one output, the verdict: one line of JSON with fixed keys (ids, commits, hashes, one word of
  # a list) that the job that signs reads as data and checks again. No artifact, no cache. Inside it the code runs as
  # another user, with an empty environment and no network. The step before the judge checks that last part the way the judge starts the code, on
  # this very machine, and fails the job before any of the pull request's code runs if there is a route out.
  judge:
    needs: review
    if: needs.review.outputs.tests != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: knos-judge-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
    cache-mode: read
    permissions:
      contents: read          # the two trees; nothing else of the repository, and nothing to write
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}     # data for the job that signs, which believes none of it unchecked
    steps:
      - name: the default branch with its history, into base/
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: base
          fetch-depth: 0
          persist-credentials: false
      - name: the pull request's head commit, as plain files, into pr/ (nothing in it is run here)
        env:
          PULL: ${{ needs.review.outputs.pull }}
          HEAD: ${{ needs.review.outputs.head }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$PULL" in ''|*[!0-9]*) echo "The review named no pull request."; exit 1;; esac
          case "$HEAD" in ''|*[!0-9a-f]*) echo "The review named no head commit."; exit 1;; esac
          # The job's token goes with this one fetch (a private repository needs it) through git's environment. It is
          # never written to the clone, and it is gone when this step ends: the step that runs the pull request's code
          # has no token at all.
          basic=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$basic"
          n=${GIT_CONFIG_COUNT:-0}
          export GIT_CONFIG_COUNT=$((n + 1)) "GIT_CONFIG_KEY_$n=http.$GITHUB_SERVER_URL/.extraheader" \
                 "GIT_CONFIG_VALUE_$n=AUTHORIZATION: basic $basic"
          git -C base fetch -q --no-tags origin "+refs/pull/$PULL/head:refs/knos/head"
          if [ "$(git -C base rev-parse refs/knos/head)" != "$HEAD" ]; then
            echo "The pull request has a newer head commit than the one that was reviewed. The run for the newer commit judges it."
            exit 1
          fi
          mkdir pr
          GIT_LFS_SKIP_SMUDGE=1 git -C base archive "$HEAD" | tar -x -C pr       # files only: no .git, no hooks, no large files
          # what the pull request changed since it left the default branch, a rename under both its names
          git -C base diff --no-renames --name-only "$GITHUB_SHA...$HEAD" > changed.txt
      - name: uv, with no cache
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.8.20"
          python-version: "3.12"
          enable-cache: false      # nothing is restored into a job that runs here, and nothing is saved from it
          ignore-empty-workdir: true
      - name: install knos, this one requirement exactly, with pytest and pip for the trees it judges
        env:
          UV_EXCLUDE_NEWER: "2026-10-10T00:00:00Z"
        run: uv tool install --no-config --with pytest --with pip "knos==0.3.19"
      # The same layers the judge puts around the code (sudo, a network namespace of its own, the user nobody, an empty
      # environment), and a program that tries to reach three well-known addresses by number. If it gets out, or the
      # sandbox cannot be made here, the job ends now.
      - name: the sandbox has no network (checked here, before any pull request code runs)
        run: |
          set -euo pipefail
          probe=$(cat <<'PY'
          import socket
          for host in ("1.1.1.1", "8.8.8.8", "140.82.112.3"):
              s = socket.socket()
              s.settimeout(3)
              try:
                  s.connect((host, 443))
              except OSError:
                  continue
              print("reached " + host)
              raise SystemExit(1)
          print("no network")
          PY
          )
          python=$(command -v python3)
          out=$(sudo -n unshare -n -- sh -c 'ip link set lo up 2>/dev/null; exec "$@"' sh \
                  setpriv --reuid=65534 --regid=65534 --clear-groups -- env -i "$python" -c "$probe" 2>&1) || true
          if [ "$out" != "no network" ]; then
            echo "The sandbox for the pull request's code is not safe on this machine ($out). None of that code was run."
            exit 1
          fi
          echo "$out"
      - name: knos proof judge, in the sandbox
        env:
          ISSUE: ${{ needs.review.outputs.tests }}
        run: knos proof judge --base base --pr pr --issue "$ISSUE" --changed changed.txt --sandbox require
      # Only after the suite passed. One line: which run, pull request, issue and commits, the hash of the acceptance
      # checks that ran, a hash of the changed paths. Nothing in it is free text.
      - name: the verdict, one line of fixed fields (the job that signs checks every one)
        id: verdict
        env:
          ISSUE: ${{ needs.review.outputs.tests }}
          PULL: ${{ needs.review.outputs.pull }}
          HEAD: ${{ needs.review.outputs.head }}
        run: >-
          "$(uv tool dir)/knos/bin/python" -m knos.verdict_gate emit --base base --issue "$ISSUE" --changed changed.txt

  # ---- tests mode: the token, in a job that never sees pull request code ---------------------------------------------
  attest:
    needs: [review, judge]
    if: needs.review.outputs.tests != '' && needs.judge.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The line of the runs started by hand, each in its turn. A merge waits in the line of its own commit, so it does
    # not wait for this job: should both prove the same pull request, the chain pays it once.
    concurrency:
      group: knos-settle
      queue: max
    cache-mode: read
    permissions:
      contents: read          # the acceptance checks on the default branch, read through GitHub's API (no checkout)
      issues: write
      pull-requests: write
      checks: read
      statuses: read
      actions: read
      id-token: write         # the pay token
    steps:
      - name: uv, with no cache
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.8.20"
          python-version: "3.12"
          enable-cache: false      # nothing is restored into a job that runs here, and nothing is saved from it
          ignore-empty-workdir: true
      - name: install knos and what it needs, each by its hash, and nothing else
        run: |
          uv venv --no-config --python 3.12 "$RUNNER_TEMP/knos"
          uv pip install --no-config --python "$RUNNER_TEMP/knos/bin/python" --require-hashes --no-deps --no-build -r - <<'LOCK'
          KNOS_LOCK
          LOCK
          echo "$RUNNER_TEMP/knos/bin" >> "$GITHUB_PATH"
      # Before anything can be signed. The verdict is text from a machine that ran a stranger's code: it is parsed
      # strictly, held to this run, pull request, issue and pair of commits, and what GitHub records is worked out again
      # here. This step asks GitHub for no token; a verdict that does not hold ends the job.
      - name: the judge's verdict, read as data and checked again here
        env:
          GH_TOKEN: ${{ github.token }}
          VERDICT: ${{ needs.judge.outputs.verdict }}
          PULL: ${{ needs.review.outputs.pull }}
          HEAD: ${{ needs.review.outputs.head }}
          ISSUE: ${{ needs.review.outputs.tests }}
        run: python -m knos.verdict_gate check
      - name: knos settle, for the pull request, the head commit and the issue the judge passed
        env:
          GH_TOKEN: ${{ github.token }}
          KNOS_RELAY_KEY: ${{ secrets.KNOS_RELAY_KEY }}
          # from review, a job that ran no pull request code; never from judge
          PULL: ${{ needs.review.outputs.pull }}
          HEAD: ${{ needs.review.outputs.head }}
          ISSUE: ${{ needs.review.outputs.tests }}    # the issue whose acceptance checks the judge ran, and no other
        run: >-
          knos settle --tests --pull "$PULL" --head "$HEAD" --issue "$ISSUE"
          --event "$GITHUB_EVENT_PATH" --repo "$GITHUB_REPOSITORY"
