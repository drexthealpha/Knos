# Every NEAR test (near/scripts/verify.sh): the contract's unit tests, both wasm builds and the near-sandbox flow, on
# each push that changes near/. It prints "N/N tests passed (M of them attacks)" and fails unless every test passes.
name: near-tests
on:
  push:
    branches: [main]
    paths: ["near/**", ".github/workflows/near-tests.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency: {group: near-tests, cancel-in-progress: true}
env:
  KNOS_NEAR_AI_OFF: "1"   # no NEAR AI model call ever runs in CI (its $10 credit is for live orders)
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            near/market
            near/contract
            near/mock-usdc
            near/sandbox
      - name: the wasm target and cargo-near 0.22.0 (the release binary, held to its published sha256)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libudev-dev pkg-config   # cargo-near's hidapi needs libudev
          rustup target add wasm32-unknown-unknown
          # the release's own binary: compiling cargo-near took 17 of the run's 27 minutes (run 45056343859)
          curl -sSfL -o cargo-near.tgz https://github.com/near/cargo-near/releases/download/cargo-near-v0.22.0/cargo-near-x86_64-unknown-linux-gnu.tar.gz
          echo "9429064e30a427e96523f539cb255f3688d2345e5000d7d4e4873a8247247d1a  cargo-near.tgz" | sha256sum -c -
          tar -xzf cargo-near.tgz && install -m 755 "$(find . -maxdepth 2 -type f -name cargo-near | head -1)" ~/.cargo/bin/cargo-near && rm -rf cargo-near.tgz cargo-near-x86_64-unknown-linux-gnu
          cargo near --version
      - name: near/scripts/verify.sh
        run: set -o pipefail; bash near/scripts/verify.sh | tee near-tests.txt
      - name: the test counts, in the run's summary (readable without a GitHub login)
        if: always()
        run: |
          { echo '```'; grep -E "test result|passed|failed" near-tests.txt | tail -20; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
      - name: the jobs contract's wasm, as verify.sh built it (Round 11, deployed from this artifact)
        if: always()
        run: |
          w=$(find /tmp/near-target near/contract/target -name knos_near.wasm 2>/dev/null | head -1); mkdir -p jobs-wasm
          [ -n "$w" ] && cp "$w" jobs-wasm/ && sha256sum jobs-wasm/knos_near.wasm | tee -a near-tests.txt || echo "no knos_near.wasm built"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jobs-wasm
          path: jobs-wasm/
      - name: the claim market (near/market), its unit tests and its wasm
        run: |
          set -o pipefail
          (cd near/market && cargo test 2>&1 | tee -a ../../near-tests.txt | tail -15)
          (cd near/market && cargo near build non-reproducible-wasm --no-abi)
          w=$(find "${CARGO_TARGET_DIR:-near/market/target}" near/market/target -name knos_market.wasm 2>/dev/null | grep /near/ | head -1); mkdir -p market-wasm; cp "$w" market-wasm/; sha256sum market-wasm/knos_market.wasm | tee -a near-tests.txt
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: market-wasm
          path: market-wasm/
      - name: the committed wasm is the one in SHA256SUMS
        run: cd near/wasm && sha256sum -c SHA256SUMS
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: near-tests
          path: near-tests.txt
