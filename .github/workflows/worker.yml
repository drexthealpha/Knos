name: always-on worker

# Knos's relay, in public. Repositories that installed Knos (examples/knos-workflow.yml) post GitHub-signed tokens as
# comments; this job finds them (src/knos/proof/ghrelay.py), carries each to Solana devnet, where knos-oidc verifies
# GitHub's signature and knos-pay does what the token says, and pays the transaction fees. It also releases tests-mode
# payments whose review window has passed and refunds bounties past their deadline. It decides nothing: the money goes
# where the token says, and anyone can run the same command (`knos relay`).
#
# A run relays for about 4.5 minutes, a pass every 3 seconds (`knos relay --serve`: a pass that finds nothing new
# costs GitHub one conditional request per repository it knows). Thirty seconds before it stops it pauses for the 2 to
# 5 s it takes to save its notes, then starts the next run and relays on, so the next one installs while this one still
# relays, restores the notes this run just saved, and takes over with no gap of its own: the one pause at a handover is
# that save, before the next run is started. (The next run used to wait for this one to end and only then install:
# the relay was down 12 to 22 s between two runs, and a token posted then waited that long.)
# For those few seconds two runs relay with the same key, which pays nobody twice: the chain takes a token once, the
# loser of a race tries again on its next pass and finds it done, and a run logs nothing for a token whose verdict the
# log has already (ghrelay.logged). GitHub's cron only restarts the chain: a run it starts, or one started by hand,
# relays only when no run of this workflow is going.
# A run that cannot relay is red, and starts nothing. The first step after the install asks the relay for its help text,
# so an install that lacks something the relay imports fails there, before a key is read. The relay's exit status is the
# step's (nothing after it hides a failure), and the next run is started only by a run whose relay step succeeded
# after relaying its full time. After a failure the chain stops; the timer starts it again within 5 minutes. (0.3.13's
# worker installed less than its relay imported, hid the failure, and each run started the next every 15 s or so.)
# The one secret is the fee-paying key; it holds devnet SOL for fees and nobody's money.
# This job sees that secret, so nothing it installs comes from an Actions cache (`enable-cache: false`): a cache can be
# written by other runs of this repository. And everything it installs is named by hash (requirements/sign.txt,
# `uv pip install --require-hashes`): a package released after the list was written cannot reach this key. The one
# cache step below keeps the relay's own notes (the repositories it found tokens in), which are read as data and
# never run.
#
# BESIDE THE TIMER, THE EVENT (job `event`). The chain of runs above finds a token by reading comments, a pass every 3 s.
# Two things it cannot bound: a token posted while no run relays (the chain stopped; the timer restarts it within 5
# minutes, later when GitHub is busy), and a repository it has not seen yet (found by GitHub's comment search). So the
# event that posts a token may also start a run of this workflow that carries exactly that token and ends:
#   repository_dispatch, type knos-token   client_payload {"repo": "owner/name", "number": 12}: whoever holds a token
#                                          that may write this repository's contents says where a token was posted.
#   workflow_run, completed                a run of this repository's own `knos` workflow ended: its pull requests'
#                                          comments are read (GitHub sends this event only for workflows of the
#                                          repository the file is in, and only from the default branch's copy).
# An event run reads the comments the event names, queues what it finds and carries it with 4 workers
# (knos.settle.v2.relayq). It keeps no notes, saves no cache and starts no run: it is not part of the chain, and the
# chain's first step does not count it. The chain is the sweep: it carries what no event announced, and what an event
# run did not finish. Both may send the same token; the chain takes it once (docs/RELAY.md, "Events, a queue, workers").
# What the event does NOT shorten: a run takes GitHub's time to start plus this job's install (10 to 21 s were seen),
# so while the chain relays, its 3 s pass is there first. The event is for the two cases above.
#
# Each run's title names the run it takes over from, so that the first step of the next one can tell the chain's runs apart.
# An event run is titled "relay for ...", which no step of the chain counts.
run-name: ${{ inputs.after && format('relay after {0}', inputs.after) || github.event_name == 'repository_dispatch' && 'relay for a dispatch' || github.event_name == 'workflow_run' && 'relay for a run' || 'relay' }}
on:
  schedule:
    - cron: "*/5 * * * *"
  repository_dispatch:
    types: [knos-token]
  workflow_run:
    workflows: [knos]
    types: [completed]
  workflow_dispatch:
    inputs:
      after:
        description: The run this one takes over from (each run sets it for the next; leave it empty to start the chain)
        required: false
        default: ""

# No concurrency group: one would hold the next run until this one ends, which is the 12 to 22 s gap this file closes. The first
# step keeps it to one chain of runs, and ends a second chain at its next handover.
permissions:
  contents: read
  actions: write      # each run starts the next, and the first step lists the runs that are going
  issues: write       # the relay log: one line per token relayed, in the open issue labelled knos-relay

jobs:
  relay:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20     # 5 to relay; up to 10 more only in the first run after a release (the install step)
    env:
      KNOS_HOME: ${{ github.workspace }}/.knos-home
    steps:
      # A run that the run before it started takes over, unless a run older than this one took over from that run
      # already (GitHub started the next run but answered the start with an error, so it was asked again), or a run of
      # another chain relays and has not handed over (a second chain: it ends here, at its next handover). A re-run
      # relays nothing and starts nothing: its first attempt started the next run. One that the timer or a person
      # started goes on only when no run of this workflow is going or waiting (that run starts the next one); when
      # GitHub does not list them, the next tick of the timer asks again, and a run taken over relays all the same (the
      # next handover asks again).
      - name: one chain of runs at a time
        id: chain
        env:
          GH_TOKEN: ${{ github.token }}
          AFTER: ${{ inputs.after }}
        run: |
          if [ "${GITHUB_RUN_ATTEMPT:-1}" != "1" ]; then
            echo "A re-run: the first attempt of this run started the next one already, so this one relays nothing and starts nothing."
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$AFTER" in *[!0-9]*) AFTER="" ;; esac
          runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow worker.yml --limit 50 --json databaseId,status,displayTitle) || runs=""
          if [ -n "$AFTER" ]; then
            stop=$(printf '%s' "$runs" | jq -r --argjson me "$GITHUB_RUN_ID" --argjson after "$AFTER" '
              map(select(.databaseId != $me)) as $o | ($o | map(.displayTitle)) as $titles
              | [$o[] | select(.databaseId < $me) | select(.displayTitle == "relay after \($after)" or
                  (.databaseId != $after and .status != "completed" and (.displayTitle | startswith("relay after "))
                   and (.databaseId as $id | any($titles[]; . == "relay after \($id)") | not)))]
              | map(.databaseId | tostring) | join(" ")') || stop=""
            if [ -n "$stop" ]; then
              echo "Run $stop holds the chain (it took over from run $AFTER first, or another chain relays): this one ends here and starts nothing."
              echo "go=false" >> "$GITHUB_OUTPUT"
            else
              echo "go=true" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          others=$(printf '%s' "$runs" | jq --argjson me "$GITHUB_RUN_ID" '[.[] | select(.databaseId != $me and .status != "completed" and ((.displayTitle // "") | startswith("relay for ") | not))] | length') || others=""
          if [ "$others" = "0" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "Another run of this workflow is relaying and starts the next one (or GitHub did not list the runs): nothing to do."
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.chain.outputs.go == 'true'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: steps.chain.outputs.go == 'true'
        with:
          version: "0.8.20"
          python-version: "3.12"
          enable-cache: false
      # Each package by its hash, from this repository's own list, and nothing else: no `-e .`, which would build the
      # package with a build tool fetched unpinned. Knos itself runs from the checkout (PYTHONPATH below).
      # PyPI's index is a cached page and can show a release minutes after its upload: the first run after 0.3.15 was
      # pushed found "no version of" that release, failed, and the chain stopped. So ONE error is waited for, and no
      # other: the index not listing the release the list's last line names. It is asked again after 15, 30, 60, 120,
      # 180 and 195 s (10 minutes in all), then the step fails as before. A hash that does not match, a package of
      # another name, a network failure: red at once, as before.
      - name: install what the relay needs, each by its hash, and nothing else
        if: steps.chain.outputs.go == 'true'
        run: |
          uv venv --no-config --python 3.12 "$RUNNER_TEMP/knos"
          release=$(sed -n '$s/^knos==\([0-9][0-9.]*\) --hash=sha256:[0-9a-f]*$/\1/p' requirements/sign.txt)
          for nap in 15 30 60 120 180 195 end; do
            uv pip install --no-config --python "$RUNNER_TEMP/knos/bin/python" --require-hashes --no-deps --no-build -r requirements/sign.txt 2> "$RUNNER_TEMP/install.err" && break
            cat "$RUNNER_TEMP/install.err" >&2
            [ "$nap" != end ] && [ -n "$release" ] && grep -Fq "no version of knos==$release " "$RUNNER_TEMP/install.err" || exit 1
            echo "PyPI's index does not list knos $release yet: asking again in $nap s."
            sleep "$nap"
          done
          echo "$RUNNER_TEMP/knos/bin" >> "$GITHUB_PATH"
      # With exactly what was installed above. A relay that cannot even say its options ends the run here, red, before
      # the key is read and before any run is started.
      - name: the relay starts with what was installed
        if: steps.chain.outputs.go == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python -m knos relay --help
      # The notes of the run before (the newest saved). That run saved them just before it started this one.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: steps.chain.outputs.go == 'true'
        with:
          path: .knos-home
          key: knos-relay-home-${{ github.run_id }}
          restore-keys: knos-relay-home-
      # Its exit status is the step's. `relayed` is set only after the relay ended well and had relayed its time: a
      # relay that ends early, whatever its status, starts no next run either.
      - name: relay for about 4 minutes, a pass every 3 s
        id: relay
        if: steps.chain.outputs.go == 'true'
        env:
          KNOS_RELAY_KEY: ${{ secrets.KNOS_RELAY_KEY || secrets.KNOS_WORKER_KEY }}
          GH_TOKEN: ${{ github.token }}
          KNOS_RELAY_LOG_REPO: ${{ github.repository }}
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          [ -n "$KNOS_RELAY_KEY" ] || { echo "no KNOS_RELAY_KEY secret: skipped"; exit 0; }
          began=$(date +%s)
          python -m knos relay --serve 250
          [ $(( $(date +%s) - began )) -ge 200 ] || { echo "The relay ended before its time was up: this run starts no next run."; exit 1; }
          echo "relayed=true" >> "$GITHUB_OUTPUT"
      # Saved before the next run is started, so the next run restores these notes and not the ones of the run before
      # this one (the relay's notes would split in two lines of runs, each with its own day's counts and unposted lines).
      # What this run does in its last 30 s is not saved: the next run relays it too, and the log answers what it did.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: steps.chain.outputs.go == 'true'
        with:
          path: .knos-home
          key: knos-relay-home-${{ github.run_id }}
      # The next run takes 10 to 21 s to start relaying, so the two overlap for a few seconds and no token waits for a
      # run to install.
      - name: start the next run, and relay 30 s more while it installs
        if: steps.chain.outputs.go == 'true'
        env:
          KNOS_RELAY_KEY: ${{ secrets.KNOS_RELAY_KEY || secrets.KNOS_WORKER_KEY }}
          GH_TOKEN: ${{ github.token }}
          KNOS_RELAY_LOG_REPO: ${{ github.repository }}
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          [ -n "$KNOS_RELAY_KEY" ] || { echo "no KNOS_RELAY_KEY secret: skipped"; exit 0; }
          gh workflow run worker.yml --repo "$GITHUB_REPOSITORY" --ref main -f after="$GITHUB_RUN_ID" \
            && touch "$RUNNER_TEMP/knos-next" || echo "GitHub did not take the start: the last step asks again."
          python -m knos relay --serve 30
      # Only after a relay step that succeeded: a run whose relay failed (or relayed nothing, having no key) starts
      # nothing, so a build that cannot relay never starts run after run. The timer restarts the chain.
      - name: start the next run (always on), when the step before did not
        if: always() && steps.chain.outputs.go == 'true' && steps.relay.outcome == 'success' && steps.relay.outputs.relayed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: '[ -f "$RUNNER_TEMP/knos-next" ] || gh workflow run worker.yml --repo "$GITHUB_REPOSITORY" --ref main -f after="$GITHUB_RUN_ID"'

  # One event, one run: the tokens the event names, and nothing else. The same install as the chain's, by hash; no
  # cache of any kind (this job sees the fee key); nothing of the event is ever run, and none of it reaches a shell:
  # the relay reads the event's file as data, and takes a repository's name and a number from it.
  event:
    if: github.event_name == 'repository_dispatch' || github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 15     # a minute to carry; up to 10 more only in the first run after a release (the install step)
    env:
      KNOS_HOME: ${{ github.workspace }}/.knos-event-home
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.8.20"
          python-version: "3.12"
          enable-cache: false
      - name: install what the relay needs, each by its hash, and nothing else
        run: |
          uv venv --no-config --python 3.12 "$RUNNER_TEMP/knos"
          release=$(sed -n '$s/^knos==\([0-9][0-9.]*\) --hash=sha256:[0-9a-f]*$/\1/p' requirements/sign.txt)
          for nap in 15 30 60 120 180 195 end; do
            uv pip install --no-config --python "$RUNNER_TEMP/knos/bin/python" --require-hashes --no-deps --no-build -r requirements/sign.txt 2> "$RUNNER_TEMP/install.err" && break
            cat "$RUNNER_TEMP/install.err" >&2
            [ "$nap" != end ] && [ -n "$release" ] && grep -Fq "no version of knos==$release " "$RUNNER_TEMP/install.err" || exit 1
            echo "PyPI's index does not list knos $release yet: asking again in $nap s."
            sleep "$nap"
          done
          echo "$RUNNER_TEMP/knos/bin" >> "$GITHUB_PATH"
      - name: the queue starts with what was installed
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python -m knos.settle.v2.relayq --help
      - name: carry what this event names, 4 at a time
        env:
          KNOS_RELAY_KEY: ${{ secrets.KNOS_RELAY_KEY || secrets.KNOS_WORKER_KEY }}
          GH_TOKEN: ${{ github.token }}
          KNOS_RELAY_LOG_REPO: ${{ github.repository }}
          KNOS_RELAY_WORKERS: "4"
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          [ -n "$KNOS_RELAY_KEY" ] || { echo "no KNOS_RELAY_KEY secret: skipped"; exit 0; }
          python -m knos.settle.v2.relayq --event "$GITHUB_EVENT_PATH" --event-name "$GITHUB_EVENT_NAME"
