# Knos builds Knos: the brief that set this work is a Knos project on devnet
# (scripts/champion_project.txt holds its id). Each job below is named exactly after one milestone's verifier check and
# runs that test against the LIVE pages. Then `release` asks the app to release each milestone at this commit
# (POST /api/project/ci): the app reads GitHub's own record of these check runs and releases only a milestone whose
# check passed here, on the default branch. No key is sent: GitHub's record decides it.
name: champion
on:
  workflow_dispatch:
permissions:
  contents: read
  checks: read
concurrency: {group: champion, cancel-in-progress: false}
env:
  APP_URL: https://knos.onrender.com
  SITE_URL: https://drexthealpha.github.io/Knos/
jobs:
  fields_shard:
    # the 49-cell grid's demand checks in three shards (two at a time each, six at once: the free app keeps little
    # memory spare); shard 0 also reads the grid, each cell's feature and the heroes. test_fields_matrix reads them.
    runs-on: ubuntu-24.04        # Playwright 1.56 installs no Chromium on 26.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: |
          for t in 1 2 3; do timeout 120 npm install --no-save --no-audit --no-fund playwright@1.56.0 && break; [ $t != 3 ] || exit 1; done   # npm can hang
          npx playwright install chromium   # the runner's own Chrome brought its libraries; --with-deps waited 10 min on apt
          curl -fsS -m 120 -o /dev/null "$APP_URL/healthz"
      - run: node scripts/test_champion.mjs test_fields_matrix
        env:
          FIELDS_SHARD: ${{ matrix.shard }}
          FIELDS_OF: 3
  test_fields_matrix:
    # the milestone's check: it passes when all three shards did
    needs: [fields_shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "fields shards: $RESULT"
          [ "$RESULT" = success ]
        env:
          RESULT: ${{ needs.fields_shard.result }}
  test_value_vectors:
    runs-on: ubuntu-24.04        # Playwright 1.56 installs no Chromium on 26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - run: |
          for t in 1 2 3; do timeout 120 npm install --no-save --no-audit --no-fund playwright@1.56.0 && break; [ $t != 3 ] || exit 1; done   # npm can hang
          npx playwright install chromium   # the runner's own Chrome brought its libraries; --with-deps waited 10 min on apt
          curl -fsS -m 120 -o /dev/null "$APP_URL/healthz"
      - run: node scripts/test_champion.mjs "${GITHUB_JOB}"
  test_proof_first:
    runs-on: ubuntu-24.04        # Playwright 1.56 installs no Chromium on 26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - run: |
          for t in 1 2 3; do timeout 120 npm install --no-save --no-audit --no-fund playwright@1.56.0 && break; [ $t != 3 ] || exit 1; done   # npm can hang
          npx playwright install chromium   # the runner's own Chrome brought its libraries; --with-deps waited 10 min on apt
          curl -fsS -m 120 -o /dev/null "$APP_URL/healthz"
      - run: node scripts/test_champion.mjs "${GITHUB_JOB}"
  test_money_page:
    runs-on: ubuntu-24.04        # Playwright 1.56 installs no Chromium on 26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - run: |
          for t in 1 2 3; do timeout 120 npm install --no-save --no-audit --no-fund playwright@1.56.0 && break; [ $t != 3 ] || exit 1; done   # npm can hang
          npx playwright install chromium   # the runner's own Chrome brought its libraries; --with-deps waited 10 min on apt
          curl -fsS -m 120 -o /dev/null "$APP_URL/healthz"
      - run: node scripts/test_champion.mjs "${GITHUB_JOB}"
  test_companies_mode:
    runs-on: ubuntu-24.04        # Playwright 1.56 installs no Chromium on 26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - run: |
          for t in 1 2 3; do timeout 120 npm install --no-save --no-audit --no-fund playwright@1.56.0 && break; [ $t != 3 ] || exit 1; done   # npm can hang
          npx playwright install chromium   # the runner's own Chrome brought its libraries; --with-deps waited 10 min on apt
          curl -fsS -m 120 -o /dev/null "$APP_URL/healthz"
      - run: node scripts/test_champion.mjs "${GITHUB_JOB}"
  test_legibility:
    runs-on: ubuntu-24.04        # Playwright 1.56 installs no Chromium on 26.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: |
          for t in 1 2 3; do timeout 120 npm install --no-save --no-audit --no-fund playwright@1.56.0 && break; [ $t != 3 ] || exit 1; done   # npm can hang
          npx playwright install chromium   # the runner's own Chrome brought its libraries; --with-deps waited 10 min on apt
      - name: Every public page
        run: node scripts/test_ui_sota.mjs legibility
      - name: Every doc
        run: python scripts/split_paragraphs.py --check --strict
  vitals_shard:
    # six shards at once (the front door's pages in two, the app's in four): every page still gets three cold runs,
    # each a fresh browser; test_vitals below reads them all. They start once the quick jobs that open the same pages in
    # their own browsers are done (measured at the same time, the front door's pages crossed 1.5 s in 3 runs of 3)
    needs: [test_legibility, test_proof_first, test_companies_mode, test_value_vectors, test_stack_coverage]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [site0, site1, app0, app1, app2, app3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - name: This shard's pages, with the preset
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          node -e '
          const fs = require("fs"), all = JSON.parse(fs.readFileSync("scripts/public_pages.json", "utf8")).pages;
          const app = all.filter((u) => u.includes("onrender.com")), shard = process.env.SHARD;
          const site = shard.startsWith("site"), k = Number(shard.slice(-1)), n = site ? 2 : 4;
          const urls = (site ? all.filter((u) => u.includes("github.io")) : app).filter((_, i) => i % n === k);
          const c = require("./apps/wanted/lighthouserc.js"), out = JSON.parse(JSON.stringify(c));
          out.ci.collect.url = urls; out.ci.collect.numberOfRuns = 3;
          out.ci.collect.settings.blockedUrlPatterns = site ? ["https://knos.onrender.com/*"] : [];
          delete out.ci.assert; delete out.ci.upload;
          fs.writeFileSync("lhci.json", JSON.stringify(out, null, 1));
          fs.writeFileSync("urls.txt", urls.join("\n") + "\n");'
      - name: Open Chrome once, and warm each page once in a throwaway profile (all at once)
        run: |
          npx --yes @lhci/cli@0.14.0 healthcheck --fatal || true
          CHROME=$(node -e 'console.log(require("chrome-launcher").Launcher.getInstallations()[0] || "")' 2>/dev/null || true)
          "${CHROME:-google-chrome}" --headless=new --no-sandbox --disable-gpu --dump-dom about:blank > /dev/null 2>&1 || true
          while read -r u; do
            ( curl -fsS -m 120 -o /dev/null "$u" || true
              timeout 60 "${CHROME:-google-chrome}" --headless=new --no-sandbox --disable-gpu --user-data-dir="$(mktemp -d)" \
                --virtual-time-budget=8000 --dump-dom "$u" > /dev/null 2>&1 || true ) &
          done < urls.txt
          wait
          # nothing of the warm-up may run while pages are measured: a leftover renderer of a warm-up Chrome took the
          # CPU in run 39997654630 (the runner's benchmark 8% lower, the browser's own work 3.4x), and the home page
          # read 213 ms of blocking time where its other runs read 0
          pkill -f -- "--dump-dom" || true
          sleep 2
          left=$(pgrep -fc -- "--dump-dom" || true); echo "warm-up Chrome processes left: ${left:-0}"
      - name: Three cold runs of each page
        run: npx --yes @lhci/cli@0.14.0 collect --config=lhci.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vitals-${{ matrix.shard }}
          path: .lighthouseci/
          include-hidden-files: true
  test_vitals:
    needs: [vitals_shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: vitals-*
          path: .lighthouseci
          merge-multiple: true
      - run: node scripts/test_quality_bar.mjs vitals .lighthouseci
  test_stack_coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: pip install -q -e .
      - run: python scripts/test_stack_coverage.py "$APP_URL"
  test_knos_builds_knos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/test_knos_builds_knos.py "$(cat scripts/champion_project.txt)" --except test_knos_builds_knos
  release:
    needs: [test_fields_matrix, test_value_vectors, test_proof_first, test_money_page, test_companies_mode, test_legibility,
            test_vitals, test_stack_coverage, test_knos_builds_knos]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Ask the app to release each milestone whose check passed at this commit
        run: |
          pid=$(cat scripts/champion_project.txt)
          curl -fsS -m 120 -o /dev/null "$APP_URL/healthz"
          curl -fsS -m 60 "$APP_URL/api/project?id=$pid" | python3 -c 'import json,sys; [print(m["key"], m["verifier"]["check"], m["status"]) for m in json.load(sys.stdin)["milestones"]]' > milestones.txt
          while read -r key check status; do
            [ "$status" = released ] && { echo "$check: already released"; continue; }
            body=$(printf '{"project":"%s","milestone":"%s","sha":"%s"}' "$pid" "$key" "$GITHUB_SHA")
            code=$(curl -sS -m 300 -o out.json -w '%{http_code}' -H 'Content-Type: application/json' -d "$body" "$APP_URL/api/project/ci")
            echo "$check: HTTP $code $(head -c 400 out.json)"
          done < milestones.txt

  # The same results, signed with this run's GitHub identity and logged in Sigstore's public Rekor v2 log: anyone can
  # check them without Knos (scripts/verify_proofs.sh, or `sigstore verify github` by hand).
  proofs:
    needs: [test_fields_matrix, test_value_vectors, test_proof_first, test_money_page, test_companies_mode, test_legibility,
            test_vitals, test_stack_coverage, test_knos_builds_knos]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {contents: read, id-token: write}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with: {version: "0.8.20", python-version: "3.12", enable-cache: false}
      - name: install sigstore-python and what it needs, each by its hash
        run: |
          uv venv --no-config --python 3.12 "$RUNNER_TEMP/sg"
          uv pip install --no-config --python "$RUNNER_TEMP/sg/bin/python" --require-hashes --no-deps --no-build -r requirements/rekor.txt
      - name: write each test's result at this commit
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          needs = json.loads(os.environ["NEEDS"])
          out = {"repository": os.environ["GITHUB_REPOSITORY"], "workflow": "champion.yml", "run_id": os.environ["GITHUB_RUN_ID"],
                 "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"], "sha": os.environ["GITHUB_SHA"],
                 "results": {name: job["result"] for name, job in sorted(needs.items())}}
          open("proofs.json", "w").write(json.dumps(out, indent=1) + "\n")
          print(json.dumps(out["results"]))
          PY
      - name: sign into Rekor v2, then verify as an outsider would
        run: |
          "$RUNNER_TEMP/sg/bin/python" scripts/rekor_v2_config.py "$RUNNER_TEMP/trust.json"
          "$RUNNER_TEMP/sg/bin/sigstore" --trust-config "$RUNNER_TEMP/trust.json" sign --rekor-version 2 --bundle proofs.sigstore.json proofs.json
          "$RUNNER_TEMP/sg/bin/sigstore" verify github --bundle proofs.sigstore.json --repository "$GITHUB_REPOSITORY" \
            --cert-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/champion.yml@$GITHUB_REF" --sha "$GITHUB_SHA" proofs.json
          python3 -c 'import json;e=json.load(open("proofs.sigstore.json"))["verificationMaterial"]["tlogEntries"][0];print("rekor", e["kindVersion"], "log index", e["logIndex"])'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with: {name: proofs, path: "proofs*.json"}
