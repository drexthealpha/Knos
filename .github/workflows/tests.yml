name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # universal-ctags is optional: knos reads code structure itself without
      # it, and one job that proves the fallback works is worth more than a
      # matrix that hides it.
      - run: pytest -q
