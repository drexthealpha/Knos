name: tests

# PRs and main stay under 5 minutes of wall time: uv with a cache and pytest -n auto. The suite is offline (conftest
# refuses every non-loopback connection) and includes the two Solana programs in LiteSVM, the judge on Python, Node,
# Go and Rust repositories, its sandbox, and the tamper benchmark.
#
# This is also the gate of every release: release.yml calls this whole workflow on the tagged commit (workflow_call)
# and publishes nothing unless every job here passed. A job added here is part of that gate; do not give one a
# condition that would skip it there.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
  workflow_call:

# Named, not ${{ github.workflow }}: called from release.yml that would be the caller's name, and a group shared with
# the caller cancels it.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.10"}
          - {os: ubuntu-latest, python: "3.12"}
          - {os: macos-latest, python: "3.12"}
          - {os: windows-latest, python: "3.12"}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv pip install --system -e ".[dev]"
      - run: git config --global user.email ci@example.invalid && git config --global user.name ci
      - run: pytest -q -n auto
      # The 30-second story, on every OS: the wheel installs into a clean venv, `knos init` installs the Stop hook
      # into a fresh home, the hook answers, and `knos init --undo` leaves the settings as they were.
      - name: wheel installs and knos init works in a clean home
        shell: bash
        run: |
          uv build --wheel
          uv venv "$RUNNER_TEMP/clean" -q
          if [ -d "$RUNNER_TEMP/clean/bin" ]; then BIN="$RUNNER_TEMP/clean/bin"; else BIN="$RUNNER_TEMP/clean/Scripts"; fi
          VIRTUAL_ENV="$RUNNER_TEMP/clean" uv pip install -q dist/*.whl
          export PATH="$BIN:$PATH" HOME="$RUNNER_TEMP/home" USERPROFILE="$RUNNER_TEMP/home"
          mkdir -p "$HOME/.claude"
          start=$(date +%s)
          knos init --hosts claude
          grep -q "hook proof --client claude" "$HOME/.claude/settings.json"
          echo '{"cwd": ".", "last_assistant_message": "Here is a plan."}' | knos hook proof --client claude
          test $(( $(date +%s) - start )) -le 30
          knos init --undo --hosts claude
          ! grep -q "knos" "$HOME/.claude/settings.json"

  # The JavaScript client against the byte-exact fixtures the Python client wrote (sdk/settle/fixtures.json), and the
  # web app that uses it.
  sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - run: node sdk/settle/test.mjs
      - name: the built site in headless Chromium (mocked GitHub and Solana)
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.0
          npx playwright install --with-deps chromium
          bash scripts/build_site.sh "$RUNNER_TEMP/site" "$(printf 'c%.0s' $(seq 40))"   # the commit the mocked chain pins
          node tests/web/site.mjs "$RUNNER_TEMP/site"

  # Every number in the README opening, the home page, the submission and the pitch script is checked against a file
  # in the repo, devnet or GitHub (scripts/claims_check.py).
  claims:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: pip install -q -e .
      - run: python scripts/claims_check.py
        env:
          GH_TOKEN: ${{ github.token }}

  # ruff (imports, statements, syntax, pyflakes) and mypy over src/knos, each at one version, with the settings in
  # pyproject.toml. Permissive to start: pyproject.toml lists, in words, what is not checked (one ruff rule and 16
  # modules of mypy's) so each can come out one line at a time. The package is installed so that mypy reads the types
  # of what it imports, as a developer's editor does. About a minute with the cache.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv pip install --system -e . ruff==0.15.11 mypy==1.20.2
      - run: ruff check .
      - run: mypy

  # Nothing unused ships: every module is reached from an entry point, and vulture finds no unused code beyond the
  # framework-called names listed (with reasons) in scripts/vulture_whitelist.py.
  deadcode:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv pip install --system -e . vulture==2.14
      - run: python scripts/deadcode.py
      - run: vulture src/knos scripts --min-confidence 60
      - run: python scripts/settle_fixtures.py --check
