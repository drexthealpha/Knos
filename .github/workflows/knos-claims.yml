# The repo checking itself: if a pull request touches work someone has
# claimed in .knos/decisions.md, say so. Never fails the build.
#
# This runs the composite action, not the script inside it, so the path a
# maintainer copies out of the README is the same path that runs here. The
# ref is `./action` rather than the published tag because a repository
# testing its own action from its own tag would only ever prove the tag it
# already had; this proves the action as it stands in the commit.
name: knos claims

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./action
