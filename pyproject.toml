[build-system]
requires = ["hatchling==1.32.4"]   # pinned: the wheel must come out the same on every machine (requirements/build.txt has the hashes)
build-backend = "hatchling.build"

[project]
name = "knos"
version = "0.3.25"
description = "The neutral meter for AI agent work: neither side keeps the count."
readme = "README.pypi.md"   # README.md with its links pinned to the tag (scripts/bump_version.py writes it)
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "drexthealpha", email = "zulibro1999@gmail.com" }]
keywords = ["neutral-meter", "metering", "ai-agents", "coding-agents", "invoice-reconciliation", "attestation", "verification", "escrow", "solana", "oidc", "github-actions", "agent-payments", "sibyl", "claude-code-hooks"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
  "typer>=0.12",
  "rich>=13",
  # The memory engine: what the Stop hook and the judge learn is kept in a Sibyl store, and nowhere else.
  "sibyl-memory-client>=0.8.1",
  # Solana: instructions and transactions are built and signed with solders.
  "solders>=0.29",
  # .knos/proof.toml is read with tomllib, which arrived in 3.11.
  "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "pytest-xdist>=3",
  "pyyaml>=6",
  # the differential test: the on-chain RSA verifier against OpenSSL
  "cryptography>=42",
]

[project.scripts]
knos = "knos.__main__:main"

[project.urls]
Homepage = "https://github.com/drexthealpha/Knos"
Repository = "https://github.com/drexthealpha/Knos"
Issues = "https://github.com/drexthealpha/Knos/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/knos"]

# the registry of published terms, which `knos terms cite` and `knos terms verify` read (src/knos/terms_registry.py)
[tool.hatch.build.targets.wheel.force-include]
"terms" = "knos/_terms"

[tool.hatch.build.targets.sdist]
# anchored at the root: a bare name would also take every README.md and tests/ folder below it (the crates', the
# JavaScript client's, which the stamp of the pinned workflows writes), and the sdist must not change with the stamp
include = ["/src/knos", "/terms", "/tests", "/README.md", "/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `pytest -m "not slow" -n auto` is the local loop. A test is slow when tests/slow.txt lists it (tests/conftest.py puts
# the marker on; scripts/suite_time.py --slow prints the list from a run's JUnit file). CI runs them all, in a job of
# their own on each platform.
markers = ["slow: takes over 5 seconds (listed in tests/slow.txt); left out by -m \"not slow\""]

# ---- lint and types: tests.yml runs `ruff check .` and `mypy` (both pinned there). Permissive to start: what is not
# ---- checked is listed here, in words, so it can be taken out one line at a time.

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]                # ruff's own default set: imports, statements, syntax, pyflakes
# E702 (`a; b` on one line) is the dense style of the byte-level harnesses and fixture scripts: 56 places in
# scripts/settle_fixtures.py, tests/_oidc2.py, tests/_pay2.py, tests/_settle.py, tests/test_oidc_chain.py and
# tests/test_pay_chain.py. Not ignored: everything else in the set, in every file.
ignore = ["E702"]

[tool.mypy]
files = ["src/knos"]
python_version = "3.10"
ignore_missing_imports = true                   # the memory engine ships no types, and PyYAML's are a package of their own
follow_imports = "silent"
# Everything under src/knos is checked in full: the payment path (knos.flow, knos.who, knos.terms, knos.chain,
# knos.settle.relay, knos.proof.ghrelay, and the package knos.settle.v2.relay, one module until 0.3.21 and the last
# one left out) included, and every new module. Where a value the code has already tested cannot be seen as tested
# by mypy, the line says so in a `type: ignore[...]` with its reason. Untyped function
# bodies are not checked (mypy's default); tests/ and scripts/ are not type-checked.
