# docker compose up -d --build   (from iris/, after: cp .env.example .env and bash scripts/load-image.sh <tar>)
services:
  iris:
    build:
      context: ..
      dockerfile: iris/Dockerfile
      args:
        KNOS_FHIR: "${KNOS_FHIR:-0}"
    image: knos-iris:local          # local only: built on the EAP image, never pushed
    container_name: knos-iris
    hostname: knos-iris
    mem_limit: 3g
    env_file: .env
    environment:
      # required: the predefined accounts take this password at every start (scripts/iris-password.sh), and the signing
      # secrets of check runs and referee verdicts; compose refuses to start without them
      IRIS_PASSWORD: "${IRIS_PASSWORD:?set IRIS_PASSWORD in iris/.env}"
      KNOS_WEBHOOK_SECRET: "${KNOS_WEBHOOK_SECRET:?set KNOS_WEBHOOK_SECRET in iris/.env}"
      KNOS_VERDICT_SECRET: "${KNOS_VERDICT_SECRET:?set KNOS_VERDICT_SECRET in iris/.env}"
      # KNOS_AI_MODE=local: the AI Hub agent asks the ollama service below through AI Hub's "openai" provider
      KNOS_LOCAL_LLM_URL: "${KNOS_LOCAL_LLM_URL:-http://ollama:11434/v1}"
    command: ["--after", "sh /home/irisowner/knos/iris/scripts/iris-password.sh"]
    ports:
      - "52773:52773"
      - "1972:1972"
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-I", "/home/irisowner/knos/iris/scripts/knos_http.py", "http://localhost:52773/api/knos/health"]
      interval: 15s
      timeout: 10s
      retries: 40
  # the local model of KNOS_AI_MODE=local: no key, no account. The first start pulls the model (about 1 GB) into the
  # volume; later starts reuse it.
  ollama:
    image: ollama/ollama:0.40.14
    container_name: knos-ollama
    mem_limit: 2g
    entrypoint: ["/bin/sh", "-c", "ollama serve & until ollama list >/dev/null 2>&1; do sleep 1; done; ollama pull ${KNOS_LOCAL_MODEL:-qwen2.5:1.5b-instruct} && wait"]
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q '${KNOS_LOCAL_MODEL:-qwen2.5:1.5b-instruct}'"]
      interval: 10s
      timeout: 5s
      retries: 90
      start_period: 20s
volumes:
  ollama:
