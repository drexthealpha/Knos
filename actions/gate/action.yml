name: Knos Gate
description: Runs a maintainer's sealed hidden tests and the Knos cheat checks on an outside pull request. One check, one comment, a signed receipt.
author: drexthealpha
branding:
  icon: shield
  color: green

# Use it from a workflow_run workflow whose job is named "Knos Gate" (actions/gate/knos-gate.yml is the file to copy,
# with actions/gate/knos-gate-pr.yml, the pull_request workflow it starts after), passing `pr` and `head`. That job sets
# the commit status "Knos Gate"; this action posts the one comment and edits it in place on every push.
#
# Why two workflows: a fork's `pull_request` run gets no secret, and the hidden tests are a secret. So the pull request's
# own run (knos-gate-pr.yml) has no secret, and the run that holds the secret starts from the default branch on
# workflow_run and must never run the pull request's code with it. This action:
#   - reads .knos/gate.yml and runs `setup` from the BASE commit only, before the pull request's code is on disk;
#   - fetches the pull request's head into its own folder and never runs anything from it outside the sandbox;
#   - runs tests in the sandbox: a user of its own (knos-sandbox) that cannot write the runner's files (so not
#     $GITHUB_ENV, not this job's Knos install), in a network namespace with no network, with an environment of
#     PATH/HOME/LANG only: no token, no secret;
#   - keeps the suites' output in files that are deleted, and posts counts only, after checking every text against
#     the hidden files' lines.
# Knos itself is installed before any pull request code exists, from this action's own commit (or `knos-spec`).

inputs:
  hidden-tests:
    description: the sealed hidden tests (the repository secret whose name .knos/gate.yml gives; `knos gate seal DIR` makes its value)
    required: false
    default: ""
  hidden-repo-token:
    description: "hidden_tests.source: repo - a token that can read the private tests repository"
    required: false
    default: ""
  receipt-key:
    description: the receipt signing key (a secret holding a 64-number JSON array); empty writes an unsigned receipt
    required: false
    default: ""
  report:
    description: "action (post the comment, labels, close) or app (leave the verdict as the artifact `knos-gate` for the Knos Gate App)"
    required: false
    default: action
  pr:
    description: "the pull request number (App mode: the dispatch's input; otherwise read from the event)"
    required: false
    default: ""
  head:
    description: "the head commit the App asked about (App mode)"
    required: false
    default: ""
  sandbox:
    description: "nonet,user: the only value the Action accepts (it fails closed otherwise)"
    required: false
    default: nonet,user
  knos-spec:
    description: install Knos from this pip spec or wheel path instead of this action's own commit
    required: false
    default: ""
  github-token:
    description: the token Gate posts with
    required: false
    default: ${{ github.token }}
  code-scanning:
    description: "true: also upload the cheat findings to GitHub code scanning as SARIF (alerts in the Security tab and on the pull request; the job needs `security-events: write`)"
    required: false
    default: "false"
  attest:
    description: "true: a GitHub artifact attestation (Sigstore) of the signed receipt, so anyone can check with `gh attestation verify receipt.json -R OWNER/REPO` that this repository's Gate run made it (the job needs `id-token: write` and `attestations: write`; public repositories, or private ones on GitHub Enterprise Cloud)"
    required: false
    default: "false"
outputs:
  passed:
    description: "true when the pull request passed Knos Gate"
    value: ${{ steps.gate.outputs.passed }}
  verdict:
    description: the verdict JSON file
    value: ${{ steps.gate.outputs.verdict }}

runs:
  using: composite
  steps:
    - name: install knos (before any pull request code exists)
      shell: bash
      env:
        KNOS_ROOT: ${{ github.action_path }}/../..
        SPEC: ${{ inputs.knos-spec }}
      run: |
        set -euo pipefail
        G="/tmp/knos-gate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"; rm -rf "$G"; mkdir -p "$G/out"; chmod 755 "$G"
        python3 -m venv "$G/knos"
        if [ -n "$SPEC" ]; then "$G/knos/bin/pip" install --quiet "$SPEC"; else "$G/knos/bin/pip" install --quiet "$KNOS_ROOT"; fi
        "$G/knos/bin/pip" install --quiet pyyaml
        python3 -m venv "$G/testenv"
        echo "G=$G" >> "$GITHUB_ENV"
    - name: the pull request, the base and the diff (nothing in the pull request runs here)
      id: pr
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_IN: ${{ inputs.pr }}
        HEAD_IN: ${{ inputs.head }}
        EVENT_PR: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        num="${PR_IN:-$EVENT_PR}"
        case "$num" in ''|*[!0-9]*) echo "Knos Gate needs a pull request (the pr input from knos-gate.yml, or the App's dispatch)."; exit 2;; esac
        gh api "repos/$GITHUB_REPOSITORY/pulls/$num" > "$G/pull.json"
        head=$(jq -r .head.sha "$G/pull.json"); base=$(jq -r .base.sha "$G/pull.json")
        if [ -n "$HEAD_IN" ] && [ "$HEAD_IN" != "$head" ]; then echo "The pull request moved on from $HEAD_IN; the run for $head decides."; exit 2; fi
        basic=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n'); echo "::add-mask::$basic"
        auth=(-c "http.$GITHUB_SERVER_URL/.extraheader=AUTHORIZATION: basic $basic")
        git init -q "$G/base"; git -C "$G/base" remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
        git "${auth[@]}" -C "$G/base" fetch -q --no-tags origin "$base" "+refs/pull/$num/head:refs/knos/head"
        [ "$(git -C "$G/base" rev-parse refs/knos/head)" = "$head" ] || { echo "The head moved while Gate fetched it; the newer run decides."; exit 2; }
        GIT_LFS_SKIP_SMUDGE=1 git -C "$G/base" checkout -q --detach "$base"
        git -C "$G/base" -c core.quotePath=false diff "$base...$head" > "$G/pr.diff"
        echo "num=$num" >> "$GITHUB_OUTPUT"; echo "head=$head" >> "$GITHUB_OUTPUT"; echo "base=$base" >> "$GITHUB_OUTPUT"
        echo "association=$(jq -r .author_association "$G/pull.json")" >> "$GITHUB_OUTPUT"
    - name: setup from the base commit (trusted, with network, before the pull request's code is on disk)
      shell: bash
      run: |
        set -euo pipefail
        "$G/knos/bin/python" -m knos.gate.cli validate "$G/base" > "$G/config.json" || { cat "$G/config.json"; exit 2; }
        setup=$(jq -r '.setup // ""' "$G/config.json")
        if [ -n "$setup" ]; then (cd "$G/base" && PATH="$G/testenv/bin:$PATH" VIRTUAL_ENV="$G/testenv" bash -c "$setup"); fi
        src=$(jq -r '.hidden_tests.source // ""' "$G/config.json")
        echo "HIDDEN_SOURCE=$src" >> "$GITHUB_ENV"
    - name: the private hidden-tests repository (hidden_tests.source repo)
      if: env.HIDDEN_SOURCE == 'repo'
      shell: bash
      env:
        TOKEN: ${{ inputs.hidden-repo-token }}
      run: |
        set -euo pipefail
        repo=$(jq -r .hidden_tests.repo "$G/config.json"); ref=$(jq -r .hidden_tests.ref "$G/config.json")
        basic=$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n'); echo "::add-mask::$basic"
        git init -q "$G/hidden"; git -C "$G/hidden" remote add origin "$GITHUB_SERVER_URL/$repo"
        git -c "http.$GITHUB_SERVER_URL/.extraheader=AUTHORIZATION: basic $basic" -C "$G/hidden" fetch -q --depth 1 origin "$ref"
        git -C "$G/hidden" checkout -q --detach FETCH_HEAD; rm -rf "$G/hidden/.git"
    - name: the pull request's tree and the sandbox user
      shell: bash
      run: |
        set -euo pipefail
        git -C "$G/base" worktree add -q --detach "$G/pr" refs/knos/head
        rm -f "$G/pr/.git"
        # fail closed: no pull request code runs unless the sandbox (a user of its own, no network) can be made
        if [ "${{ inputs.sandbox }}" != "nonet,user" ] || ! sudo -n true 2>/dev/null || ! sudo -n unshare --net true 2>/dev/null; then
          echo "Knos Gate runs a pull request's code only in its sandbox (a user of its own, no network), which needs passwordless sudo and unshare. It cannot be made here, so Gate does not run."
          exit 2
        fi
        id knos-sandbox >/dev/null 2>&1 || sudo -n useradd --system --no-create-home --shell /usr/sbin/nologin knos-sandbox
        chmod -R o+rX "$G/pr" "$G/testenv"   # the sandbox user reads them and writes neither
        echo "KNOS_GATE_SANDBOX_USER=knos-sandbox" >> "$GITHUB_ENV"
    - name: knos gate run
      id: gate
      shell: bash
      env:
        KNOS_GATE_HIDDEN_VALUE: ${{ inputs.hidden-tests }}
        KNOS_RECEIPT_KEY: ${{ inputs.receipt-key }}
        GH_TOKEN: ${{ inputs.github-token }}
        REPORT: ${{ inputs.report }}
        SANDBOX: ${{ inputs.sandbox }}
        CODE_SCANNING: ${{ inputs.code-scanning }}
      run: |
        set -uo pipefail
        hidden=()
        if [ "$HIDDEN_SOURCE" = repo ]; then hidden=(--hidden-dir "$G/hidden");
        elif [ "$HIDDEN_SOURCE" = secret ]; then hidden=(--hidden-env KNOS_GATE_HIDDEN_VALUE); fi
        post=(); [ "$REPORT" = action ] && post=(--post --annotate)
        [ "$REPORT" = action ] && [ "$CODE_SCANNING" = true ] && post+=(--code-scanning)
        # the sandbox has a user of its own, so it reads (never writes) the test environment and the pull request's tree
        PATH="$G/testenv/bin:$PATH" VIRTUAL_ENV="$G/testenv" "$G/knos/bin/python" -m knos.gate.cli run \
          --base "$G/base" --pr "$G/pr" --diff "$G/pr.diff" --repo "$GITHUB_REPOSITORY" \
          --number "${{ steps.pr.outputs.num }}" --head "${{ steps.pr.outputs.head }}" --base-sha "${{ steps.pr.outputs.base }}" \
          --association "${{ steps.pr.outputs.association }}" --pull-json "$G/pull.json" --out "$G/out" \
          --sandbox "$SANDBOX" --key-env KNOS_RECEIPT_KEY "${hidden[@]}" "${post[@]}"
        rc=$?
        sudo -n rm -rf "$G/out/work" 2>/dev/null || rm -rf "$G/out/work"   # files the sandbox user made are removed too
        echo "verdict=$G/out/verdict.json" >> "$GITHUB_OUTPUT"
        [ -f "$G/out/receipt.json" ] && echo "receipt=$G/out/receipt.json" >> "$GITHUB_OUTPUT"
        [ -f "$G/out/summary.md" ] && cat "$G/out/summary.md" >> "$GITHUB_STEP_SUMMARY"
        if [ $rc -eq 0 ]; then echo "passed=true" >> "$GITHUB_OUTPUT"; elif [ $rc -eq 1 ]; then echo "passed=false" >> "$GITHUB_OUTPUT"; fi
        echo "rc=$rc" >> "$GITHUB_OUTPUT"
    - name: the verdict and the receipt, as the artifact knos-gate
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: knos-gate
        path: |
          ${{ env.G }}/out/verdict.json
          ${{ env.G }}/out/comment.md
          ${{ env.G }}/out/summary.md
          ${{ env.G }}/out/receipt*.json
          ${{ env.G }}/out/receipt.html
          ${{ env.G }}/out/badge.svg
          ${{ env.G }}/out/knos-gate.sarif
          ${{ env.G }}/out/annotations.json
        if-no-files-found: warn
        retention-days: 90
    - name: an artifact attestation of the signed receipt (Sigstore; `gh attestation verify receipt.json -R OWNER/REPO`)
      if: always() && inputs.attest == 'true' && steps.gate.outputs.receipt != ''
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-path: ${{ env.G }}/out/receipt.json
        predicate-type: https://github.com/drexthealpha/Knos/blob/main/docs/reference/RECEIPT.md#knos-receipt-v1
        predicate-path: ${{ env.G }}/out/receipt.json
    - name: the check's result
      shell: bash
      run: |
        rc="${{ steps.gate.outputs.rc }}"
        [ "$rc" = 0 ] && exit 0
        [ "$rc" = 1 ] && { echo "Knos Gate refused this pull request (see the comment)."; exit 1; }
        echo "Knos Gate could not run (see above)."; exit 1
