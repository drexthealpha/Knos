[package]
name = "upgrade_gate"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
license = "MIT"
description = "Example: an on-chain record that GitHub's runner built one executable from one commit of Knos, written only on a token knos-oidc verified."

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
solana-program = "=2.2.1"
# What an outside team writes: knos-oidc-interface = { git = "https://github.com/drexthealpha/Knos", tag = "v0.3.14" }
knos-oidc-interface = { path = "../../crates/knos-oidc-interface" }

[lints.rust]
unexpected_cfgs = { level = "allow" }
