# .github/workflows/knos-on-linear.yml: the Linear issue a merged pull request names is done, so the pull request is
# accepted.
#
# What it does. For each pull request merged here in the last DAYS days that names a Linear issue that is done
# (and that does not carry the status yet):
#   1. it writes the commit status tracker/linear-done = success on the pull request's last commit, and
#   2. it starts this repository's own `knos` workflow for that pull request (`gh workflow run knos.yml -f pull=N`),
#      whose settle job is Knos's pinned prove.yml. That run reads GitHub's record again, and asks GitHub to sign only if
#      every check the order's terms name passed at that commit. This file signs nothing and holds no token of GitHub's
#      signature (no `id-token`).
#
# Make it a condition of payment, not only a moment: fund the order with the status as a named check,
#     /knos fund 500 checks: test, tracker/linear-done
# The names are hashed into the order at funding, so the order cannot be paid before this status is there.
# Without it in the terms this file only chooses WHEN the payment is tried.
#
# Who authenticates what. The chain authenticates the settle run: GitHub's signature over a run of the pinned prove.yml,
# at the commit the order recorded, in the order's own repository (programs-v2/knos_pay/src/order_judge.rs, judge a;
# that rule names no event, and the pinned prove.yml settles on `workflow_dispatch`). The chain does NOT authenticate
# Linear.
# What it sees is a commit status of this repository, as the settle run read it from GitHub's API.
# So what stays trusted: everyone who can write a commit status here (write access, or a token with `statuses: write`),
# this file as it is on the default branch, and GitHub's API.
#
# Every merged pull request that matches gets Knos's answer on it, also "nothing is in escrow". To act on fewer, set
# QUERY to more search terms (for example `label:funded`).
#
# The tracker signs its webhooks with a secret both sides share (an HMAC). A chain cannot check that: it would have to
# hold the secret, and then anyone could forge the tracker. So nothing the tracker sends is believed. This file asks
# the tracker's API, with a read-only token, what state the issue is in NOW, and acts on the answer. No server of
# yours or Knos's receives anything.
#
# How a pull request names its issue: its title, branch or description holds the issue's identifier, like ENG-123
# (Linear's own branch names do).
#
# What starts it: a timer, or you by hand. Linear's webhooks cannot call GitHub themselves: they send Linear's own
# headers (Linear-Signature, Linear-Delivery, Linear-Event) and no Authorization header, and GitHub's API takes none
# without one. https://linear.app/developers/webhooks  So this file asks instead of being told.
#
# Trusted in this path, plainly: Linear's API answer as this file read it; this repository's secret LINEAR_API_KEY (who
# holds it reads your Linear); everyone who can change an issue's state in Linear; and what the header above lists.
# The chain authenticates the workflow that settles, never Linear.
name: knos on linear

on:
  schedule:
    - cron: "*/15 * * * *"        # GitHub may start it late, and stops timers after 60 days without activity
  workflow_dispatch:

permissions: {}

concurrency:
  group: knos-adapter-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  accept:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pull-requests: read     # the merged pull requests
      statuses: write         # the one status this file writes
      actions: write          # start this repository's own knos workflow by hand
    env:
      GH_TOKEN: ${{ github.token }}
      R: ${{ github.repository }}
      KNOS_WORKFLOW: knos.yml         # the file examples/knos-workflow.yml is installed as
      DAYS: "14"
      QUERY: ""
      CONTEXT: tracker/linear-done
      SAID: The Linear issue is completed
      URL: https://linear.app
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}        # a personal API key with read access: https://linear.app/developers/graphql
    steps:
      - name: say it on each merged pull request, and try its payment
        run: |
          set -euo pipefail
          since=$(jq -rn --argjson days "$DAYS" 'now - $days * 86400 | strftime("%Y-%m-%d")')
          gh api -X GET search/issues -f q="repo:$R is:pr is:merged merged:>=$since $QUERY" -f per_page=100 --jq '.items[].number' > pulls.txt
          while read -r n; do
            pr=$(gh api "repos/$R/pulls/$n")
            head=$(jq -r .head.sha <<<"$pr")
            said=$(gh api "repos/$R/commits/$head/status" --jq '.statuses[] | select(.state == "success") | .context')
            if grep -qxF "$CONTEXT" <<<"$said"; then continue; fi        # said already: nothing is done twice
            key=$(jq -r '[.title, .head.ref, (.body // "")] | join(" ") | ascii_upcase' <<<"$pr" | grep -oE '\b[A-Z][A-Z0-9]{1,9}-[0-9]{1,6}\b' | head -n 1 || true)
            [ -n "$key" ] || continue
            ask=$(jq -n --arg id "$key" '{query: "query($id: String!) { issue(id: $id) { identifier state { type } } }", variables: {id: $id}}')
            state=$(curl -sS --fail-with-body https://api.linear.app/graphql -H "Authorization: $LINEAR_API_KEY" -H "Content-Type: application/json" --data "$ask" \
                    | jq -r '.data.issue.state.type // empty' || true)
            [ "$state" = completed ] || continue        # Linear's state types: triage, backlog, unstarted, started, completed, canceled
            gh api -X POST "repos/$R/statuses/$head" -f state=success -f context="$CONTEXT" -f description="$SAID" -f target_url="$URL" > /dev/null
            gh workflow run "$KNOS_WORKFLOW" --repo "$R" -f pull="$n"
            echo "pull request #$n: $CONTEXT, and its payment is tried"
          done < pulls.txt
