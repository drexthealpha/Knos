[package]
name = "workflow_vault"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
license = "MIT"
description = "Example: a token vault with no private key. It pays only on a GitHub-signed token from one workflow file at one commit of one repository, verified on Solana by knos-oidc."

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
solana-program = "=2.2.1"
# What an outside team writes: knos-oidc-interface = { git = "https://github.com/drexthealpha/Knos", tag = "v0.3.19" }
knos-oidc-interface = { path = "../../crates/knos-oidc-interface" }

[lints.rust]
unexpected_cfgs = { level = "allow" }
