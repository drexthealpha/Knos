# The instruction handlers of the four programs, driven from Rust: tests/knos_<program>.rs loads the program's test
# binary from tests/fixtures into LiteSVM (the litesvm crate) and replays the vectors scripts/rust_test_vectors.py
# writes into ../testdata (see ../testdata/harness.rs).
#
#   cd programs-v2/handlers && cargo test --release
#
# Not a member of the programs-v2 workspace (the empty [workspace] below), so the programs' build and lockfile know
# nothing of it. It cannot be a dev-dependency of the programs themselves: `cargo build-sbf` reads the manifest of every
# package in the workspace's lockfile with its own cargo (1.84), and litesvm's tree holds packages of the 2024 edition
# that cargo cannot read. litesvm 0.7.1 is the release on the solana 2.x crates the programs are built from.
[package]
name = "knos-handler-tests"
version = "0.3.17"
edition = "2021"
publish = false

[workspace]

[dev-dependencies]
knos_oidc = { path = "../knos_oidc", features = ["no-entrypoint"] }
knos_pay = { path = "../knos_pay", features = ["no-entrypoint"] }
knos_meter = { path = "../knos_meter", features = ["no-entrypoint"] }
knos_passkey = { path = "../knos_passkey", features = ["no-entrypoint"] }
litesvm = "=0.7.1"
solana-program = "=2.2.1"
solana-account = "2.2"
solana-clock = "2.2"
solana-transaction = { version = "2.2", features = ["serde", "bincode"] }
solana-transaction-error = "2.2"
bincode = "1.3"
serde_json = "1"
hex = "0.4"
