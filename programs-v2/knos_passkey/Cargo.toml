[package]
name = "knos_passkey"
version = "0.3.13"
edition = "2021"
rust-version = "1.84"
license = "MIT"
description = "A wallet from a passkey: a token account that a WebAuthn (P-256) assertion, checked by Solana's secp256r1 precompile, can spend."

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
solana-program = "=2.2.1"
solana-security-txt = "1.1.1"

[features]
no-entrypoint = []

[lints.rust]
unexpected_cfgs = { level = "allow" }
