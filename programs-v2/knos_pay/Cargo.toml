[package]
name = "knos_pay"
version = "0.3.13"
edition = "2021"
rust-version = "1.84"
license = "MIT"
description = "Pay on proof: an escrow that pays a pull request's author on a GitHub-signed token verified by knos-oidc."

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
solana-program = "=2.2.1"
solana-security-txt = "1.1.1"
knos_oidc = { path = "../knos_oidc", features = ["no-entrypoint"] }

[features]
# devnet (default): this build is the devnet build; it enables the test-USDC faucet (InitFaucet, FaucetOpen).
# Build with --no-default-features for a cluster with real money: both refuse.
# testkeys: a TEST build. knos-oidc also trusts its seed-derived test keys, and this program also accepts a test claim
# workflow pin and a test guardian. Never deploy a testkeys build.
default = ["devnet"]
devnet = []
testkeys = ["knos_oidc/testkeys"]
no-entrypoint = []

[lints.rust]
unexpected_cfgs = { level = "allow" }
