# The claim reader against serde_json, coverage-guided. Not a member of the programs-v2 workspace (the empty
# [workspace] below), so the programs' build and lockfile know nothing of it.
#
#   cargo install cargo-fuzz
#   cd programs-v2/knos_oidc/fuzz && cargo +nightly fuzz run claims -- -max_total_time=600
#   cargo test          # stable: the same check on documents made at random from a fixed seed
[package]
name = "knos_oidc-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[lib]
path = "src/lib.rs"

[dependencies]
libfuzzer-sys = "0.4"
knos_oidc = { path = "..", features = ["no-entrypoint"] }
knos-oidc-interface = { path = "../../../crates/knos-oidc-interface" }
solana-program = "=2.2.1"
serde = "1"
serde_json = "1"

[[bin]]
name = "claims"
path = "fuzz_targets/claims.rs"
test = false
doc = false
bench = false

[workspace]
