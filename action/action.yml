name: "Knos claim check"
description: "Non-blocking note on a pull request that touches work someone already claimed in .knos/decisions.md"
author: "drexthealpha"
branding:
  icon: "message-square"
  color: "gray-dark"
inputs:
  github-token:
    description: "Token used to post the comment. Defaults to the job's GITHUB_TOKEN."
    required: false
    default: ${{ github.token }}
runs:
  using: "composite"
  steps:
    # Reads .knos/decisions.md from the checkout and the pull request's own
    # title, body and file list from the API. It never checks out, runs or
    # evaluates anything from the head branch, so it is safe under
    # pull_request_target as well as pull_request.
    - name: Note claimed work
      shell: bash
      run: python3 "${{ github.action_path }}/knos_pr_check.py"
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
