<style id="k-hero-css">
.k-hero{max-width:1200px;margin:0 auto 64px;container-type:inline-size;min-height:calc(100svh - 72px)}
.k-hero-grid{display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "ask" "card" "rest" "strip";gap:0 48px;align-items:start}
@container (min-width:900px){.k-hero-grid{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);grid-template-areas:"head card" "ask card" "rest card" "strip strip"}.k-side{padding-top:var(--sp-5)}}
.k-head{grid-area:head}.k-askbox{grid-area:ask}.k-side{grid-area:card;min-width:0}.k-rest{grid-area:rest;min-width:0}.k-strip{grid-area:strip}
.k-for{display:inline-block;margin:var(--sp-5) 0 0;padding:6px 10px;border:1px solid var(--line);border-radius:999px;font:500 13px/1 var(--text);color:var(--ink-2)}
.k-mission{font:400 clamp(48px,6.4vw,84px)/1.02 var(--serif);letter-spacing:-.01em;margin:var(--sp-5) 0 var(--sp-3);max-width:12em}
.k-mission .k-line{display:block;overflow:hidden;padding-bottom:.08em}.k-mission .k-line>span{display:block}
@media (prefers-reduced-motion:no-preference){.k-mission .k-line>span{animation:k-headrise .8s cubic-bezier(.625,.05,0,1) both}.k-mission .k-line+.k-line>span{animation-delay:.08s}}
@media (prefers-reduced-motion:reduce){.k-mission .k-line>span{animation:k-fade .4s ease both}}
@keyframes k-headrise{from{translate:0 110%}to{translate:0 0}}@keyframes k-fade{from{opacity:0}}
.k-sub{margin:var(--sp-3) 0 0;max-width:56ch;font:500 17px/1.5 var(--text);color:var(--ink-2);text-wrap:pretty}
.k-ask{position:relative;display:flex;gap:var(--sp-2);padding:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;box-shadow:var(--depth-2)}
.k-ask:focus-within{border-color:var(--accent)}
.k-ask input{flex:1;min-width:0;margin:0;padding:12px 14px;border:0;outline:0;background:transparent;color:var(--fg);font:400 var(--s1)/1.4 var(--text)}
.k-ask button{flex:none;display:inline-flex;gap:8px;align-items:center;justify-content:center;margin:0;min-height:48px;padding:12px 24px;border:0;border-radius:999px;background:var(--accent);color:var(--accent-fg);font:600 var(--s1)/1.2 var(--text);cursor:pointer}
.k-ask button:disabled{cursor:progress;background:var(--soft);color:var(--ink-2);border-color:var(--line)}
.k-i{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.k-ask button .k-spin{display:none;width:14px;height:14px;border-color:color-mix(in srgb,var(--accent-fg) 35%,transparent);border-top-color:var(--accent-fg)}
.k-ask button[aria-busy=true] .k-spin{display:inline-block}
.k-load{position:absolute;left:14px;right:14px;bottom:0;height:2px;border-radius:2px;opacity:0;pointer-events:none;background:linear-gradient(90deg,transparent,var(--accent),transparent);background-size:40% 100%;background-repeat:no-repeat}
.k-ask[aria-busy=true] .k-load{opacity:1;animation:k-bar 900ms linear infinite}
@keyframes k-bar{from{background-position:-40% 0}to{background-position:140% 0}}
.k-live{min-height:20px;margin:6px 0 0;font:400 13px/20px var(--text);color:var(--ink-2)}
.k-flow{margin:4px 0 0;padding-left:1.2em;font:400 12px/1.5 var(--code);color:var(--ink-2);max-height:9em;overflow:auto}.k-flow[hidden]{display:none}
.k-live [data-t]{font-family:var(--code);font-variant-numeric:tabular-nums}
.k-add-box{margin:2px 0 0;interpolate-size:allow-keywords}.k-add{display:inline-block;min-height:24px;color:var(--accent);font:500 13px/24px var(--text);cursor:pointer;list-style:none}.k-add::-webkit-details-marker{display:none}.k-add-box[open] .k-add{color:var(--ink-2)}
.k-opt{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px 12px;margin:6px 0 0}
.k-opt label{font:500 13px/1.3 var(--text);color:var(--ink-2)}
.k-opt label:nth-of-type(2){grid-column:2;grid-row:1}
.k-guess{display:block;width:100%;box-sizing:border-box;margin:0;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);font:400 var(--s0)/1.3 var(--text)}
.k-try{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:var(--sp-4) 0 0;color:var(--muted);font-size:var(--s0)}
.k-try [data-more-chips][hidden]{display:none}
.k-slot{min-height:296px;margin-top:var(--sp-5);scroll-margin-top:88px;container-type:inline-size}
.k-slot[data-empty]{min-height:0}
.k-past-card{padding:var(--sp-5);background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--depth-1);transition:translate 160ms var(--ease),box-shadow 160ms var(--ease)}
.k-past-card:hover{translate:0 -2px;box-shadow:var(--depth-2)}
.k-past-card .k-kick{margin:0 0 8px;color:var(--muted);font-size:var(--s-1)}
.k-past-card .k-v{margin:0 0 4px;font:600 28px/1.15 var(--head);letter-spacing:-.02em;color:var(--ok)}
.k-past-card .k-v.k-no{color:var(--bad)}
.k-past-card .k-where{margin:0 0 var(--sp-3);color:var(--ink-2);font-size:var(--s0)}
.k-bars{list-style:none;margin:0 0 var(--sp-3);padding:0;display:grid;gap:8px}
.k-bars li{display:grid;grid-template-columns:minmax(0,1fr) 3ch;gap:4px 10px;align-items:center;font-size:var(--s0)}
.k-bars span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.k-bars b{font:600 13px/1 var(--code);text-align:right;font-variant-numeric:tabular-nums}
.k-bars i{grid-column:1/-1;display:block;height:8px;border-radius:4px;background:var(--soft)}
.k-bars i::before{content:"";display:block;height:100%;width:var(--w);border-radius:4px;background:var(--accent)}
.k-past-card .k-foot a{color:var(--accent)}
.k-past-card .k-foot{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;margin:0;font-size:var(--s-1);color:var(--muted)}
.k-strip{list-style:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;margin:var(--sp-6) 0 0;padding:0;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.k-strip li{margin:0;min-width:0}
.k-strip a{display:block;height:100%;box-sizing:border-box;padding:16px;background:var(--paper);color:inherit;text-decoration:none;transition:background-color 120ms var(--ease)}
.k-strip a:hover{background:var(--paper-2)}
.k-strip b{display:block;font:600 28px/1.1 var(--head);color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.k-strip span{display:block;margin-top:4px;font-size:13px;line-height:1.35;color:var(--ink-2)}
@media (max-width:700px){.k-strip{grid-template-columns:repeat(2,minmax(0,1fr))}.k-ask{flex-direction:column}.k-ask button{width:100%}.k-opt{grid-template-columns:minmax(0,1fr)}.k-opt label:nth-of-type(2){grid-column:auto;grid-row:auto}}



.k-stops{position:relative;height:18px;margin:6px 0 0;padding:0;list-style:none;font:500 12px/18px var(--text)}
.k-stops li{position:absolute;top:0;margin:0;white-space:nowrap;color:var(--ink-2)}
.k-stops li:nth-child(2){left:33.3%;translate:-50% 0}.k-stops li:nth-child(3){left:66.7%;translate:-50% 0}.k-stops li:nth-child(4){right:0}
.k-stops li[data-on]{color:var(--ink);font-weight:600}
.k-slot:empty{min-height:0}
.k-hero[aria-busy=true] .k-slot:empty{min-height:296px;background:linear-gradient(var(--soft),var(--soft)) 24px 28px/40% 12px no-repeat,linear-gradient(var(--soft),var(--soft)) 24px 56px/70% 28px no-repeat,linear-gradient(var(--soft),var(--soft)) 24px 108px/85% 8px no-repeat,linear-gradient(var(--soft),var(--soft)) 24px 140px/70% 8px no-repeat,linear-gradient(var(--soft),var(--soft)) 24px 172px/55% 8px no-repeat;border:1px solid var(--line);border-radius:18px;box-sizing:border-box}
@media (prefers-reduced-motion:no-preference){
html.k-revealing 
::view-transition-group(k-result){animation-duration:320ms;animation-timing-function:cubic-bezier(.16,1,.3,1)}
::view-transition-old(k-result){animation:none;opacity:0}
::view-transition-new(k-result){animation:k-rise 320ms cubic-bezier(.16,1,.3,1) both}
::view-transition-group(k-pick){animation-duration:280ms;animation-timing-function:cubic-bezier(.16,1,.3,1)}
@keyframes k-rise{from{opacity:0;translate:0 12px;filter:blur(6px)}}
.k-slot[data-reveal] .k-card>*,.k-slot[data-reveal] .k-past-card>*{animation:k-row 240ms cubic-bezier(.16,1,.3,1) both;animation-delay:min(calc(var(--i,0)*40ms),280ms)}
@keyframes k-row{from{opacity:0;translate:0 6px}}
.k-add-box::details-content{transition:opacity 200ms cubic-bezier(.2,.8,.2,1),content-visibility 200ms allow-discrete;opacity:0}.k-add-box[open]::details-content{opacity:1}}
@media (prefers-reduced-motion:reduce){.k-ask[aria-busy=true] .k-load{animation:none;background:var(--accent);opacity:.5}.k-ask button .k-spin{animation:none}.k-past-card{transition:none}.k-past-card:hover{translate:none}
::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}}
.k-try .k-chip[aria-pressed=true]{view-transition-name:k-pick;background:var(--ink);color:var(--paper);border-color:var(--ink)}
.k-ask input:focus-visible,.k-guess:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.k-add-box,.k-shape{display:none}
.k-samples>summary{display:none}.k-try .k-chip:nth-of-type(n+4){display:none}
.k-try .k-chip{min-height:44px;padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:var(--paper-2);color:var(--ink);font:500 15px/1.2 var(--text);cursor:pointer}
@container (min-width:900px){.k-hero-grid:has(#k-card:empty) .k-try{justify-content:center}}
@container (max-width:560px){.k-ask{border-radius:24px}}
@container (min-width:900px){.k-hero-grid:has(#k-card:empty){grid-template-columns:minmax(0,760px);grid-template-areas:"head" "ask" "card" "rest" "strip";justify-content:center}.k-hero-grid:has(#k-card:empty) .k-head,.k-hero-grid:has(#k-card:empty) .k-sub{text-align:center}.k-hero-grid:has(#k-card:empty) .k-mission,.k-hero-grid:has(#k-card:empty) .k-sub{margin-inline:auto}}
.k-pay-fee{margin:var(--sp-2) 0 0;font:500 14px/1.4 var(--text);color:var(--ink-2)}
</style>
<div class="k-hero" id="k-hero" data-api="{API}" data-app="{APP}">
<div class="k-hero-grid">
<div class="k-head">
<h2 id="k-mission" class="k-mission"><span class="k-line"><span>See who would</span></span> <span class="k-line"><span>buy it first.</span></span></h2>

</div>
<div class="k-askbox">
<form class="k-ask" id="k-ask" autocomplete="off" role="search" aria-label="Check demand" toolname="check_demand" tooldescription="Checks whether people want a product idea or a paper's invention, using Qloo taste data, and returns a verdict, the top launch places and the Qloo calls behind it." toolautosubmit>
<input id="k-q" name="q" type="text" toolparamdescription="The product idea in plain words, or a DOI/arXiv id" aria-label="What should be built?" maxlength="500" placeholder="What should be built?" enterkeyhint="go" spellcheck="false">
<button id="k-go" type="submit"><span class="k-spin" aria-hidden="true"></span><svg class="k-i" aria-hidden="true"><use href="{ICONS}#send"/></svg><span data-label>Post a job →</span></button>
<i class="k-load" aria-hidden="true"></i>
</form>
<p class="k-sub" id="k-sub">$0 of test money unless a helper's work passes your check</p>
<script src="{POINTER}" defer></script>
<p class="k-live" id="k-live"><span data-said role="status" aria-live="polite"></span> <span data-count></span> <span data-t aria-hidden="true"></span></p>
<ol class="k-flow" id="k-flow" data-not-prose aria-label="Qloo calls as they finish" hidden></ol>
<p class="k-fine k-limit" data-qloo-limit hidden></p>
<details class="k-add-box" id="k-add" data-not-prose><summary class="k-add">+ Add market or buyer</summary>
<div class="k-opt" id="k-opt">
<label for="k-guess">Where would you launch it?</label><input id="k-guess" name="market" form="k-ask" class="k-guess" type="text" toolparamdescription="Optional launch market, a city or country" maxlength="60" autocomplete="off" spellcheck="false">
<label for="k-who">Who buys it?</label><input id="k-who" name="buyer" form="k-ask" class="k-guess" type="text" toolparamdescription="Optional buyer, in plain words" maxlength="60" autocomplete="off" spellcheck="false">
</div></details>
</div>
<div class="k-side">
<div id="k-card" class="k-slot" aria-live="polite"></div>
</div>
<div class="k-rest">
<details class="k-samples" id="k-samples" open><summary class="k-add">Try a sample</summary>
<p class="k-fine">Tap a sample to check who would buy it:</p>
<div class="k-try" role="group" aria-label="Examples: housing, food, energy, health, across technologies">
<button type="button" class="k-chip" data-tech="energy" data-need="energy" data-q="a solar powered music festival">Solar festival</button>
<button type="button" class="k-chip" data-tech="ai" data-need="food" data-q="an AI recipe planner for families">AI recipes</button>
<button type="button" class="k-chip" data-tech="web3" data-q="a crypto podcast for beginners">Crypto podcast</button>
<button type="button" class="k-chip" data-tech="quantum" data-q="a quantum physics book for kids">Quantum book</button>
<button type="button" class="k-chip" data-tech="biotech" data-need="food" data-q="a probiotic kombucha brand">Kombucha</button>
<button type="button" class="k-chip" data-tech="materials" data-q="a recycled ocean plastic swimwear brand">Ocean swimwear</button>
<span class="k-fine" data-more-chips data-needs="housing health" hidden></span></div>
</details>
<figure class="k-shape" id="k-shape" tabindex="0" data-not-prose aria-label="From demand to paid on proof: Demand, Ready brief, Money held, Paid on proof">
<svg viewBox="0 0 600 100" aria-hidden="true"><path data-shape d="M12 84 C80 84 120 36 200 36 S320 68 400 68 S520 16 588 16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
<circle data-stop r="5" cx="12" cy="84"/><circle data-stop r="5" cx="200" cy="36"/><circle data-stop r="5" cx="400" cy="68"/><circle data-stop r="5" cx="588" cy="16"/>
<circle data-dot r="7" fill="currentColor" style="offset-path:path('M12 84 C80 84 120 36 200 36 S320 68 400 68 S520 16 588 16');offset-distance:100%;offset-rotate:0deg"/></svg>
<ol class="k-stops"><li>Test set</li><li>Money held</li><li>Check runs</li><li data-on>Paid</li></ol>
</figure>
<script src="{SHAPE}" defer></script>
</div>
</div>
</div>
