<section id="k-steps" class="k-steps" aria-labelledby="k-steps-h">
  <style>#k-steps ol,#k-steps ul{display:flex;flex-wrap:wrap;gap:12px 24px;margin:12px 0;padding:0;list-style:none}#k-steps li{display:flex;align-items:center;gap:8px;font:600 var(--s0)/1.3 var(--text);color:var(--ink)}#k-steps .k-i{stroke:var(--accent)}@media (min-width:900px){#k-steps ol li + li::before{content:"\2192";color:var(--muted);margin-right:16px;font-weight:400}}@media (max-width:899px){#k-steps ol{display:grid;grid-template-columns:1fr 1fr}#k-steps ul{flex-direction:column}}#k-steps ul{border-top:1px solid var(--line);padding-top:12px}#k-steps ul li{font-weight:500}#k-steps a{color:inherit}#k-steps h2{font:600 var(--s1)/1.2 var(--head);margin:0}</style>
  <h2 id="k-steps-h">How it works</h2>
  <ol class="k-step-list">
    <li><svg class="k-i" aria-hidden="true"><use href="{ICONS}#send"/></svg>Idea or paper</li>
    <li><svg class="k-i" aria-hidden="true"><use href="{ICONS}#lock"/></svg>Test money held</li>
    <li><svg class="k-i" aria-hidden="true"><use href="{ICONS}#circle-check"/></svg><a href="{SP}check/#sample" id="steps-check">Check passed</a></li>
    <li id="step-released"><svg class="k-i" aria-hidden="true"><use href="{ICONS}#coins"/></svg>Released</li>
  </ol>
  <p class="fine" id="k-usage" data-not-prose hidden></p>
</section>
