<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- THE FRONT DOOR of the published site (scripts/site_pages.py writes it as index.html): one box, "Ask anything about
     research". A question, a claim, a link or a paper is answered at once from what Knos has proved on NEAR testnet: the
     claims registry is written into this page at build time (CLAIMS), their state comes from the site's own data/board.json
     and then the live server. A paper Knos has no claim for is asked of the server. The visitor's own questions are kept in
     their browser only (localStorage), so a second visit starts where the first ended. -->
<title>Knos: ask anything about research</title>
<meta name="description" content="Ask anything about research. Knos answers with what is proved, by which test locked on NEAR testnet, and what is behind it.">
<meta name="author" content="drexthealpha">
<meta name="color-scheme" content="light dark">
<link rel="canonical" href="https://drexthealpha.github.io/Knos/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Knos">
<meta property="og:title" content="Knos: ask anything about research">
<meta property="og:description" content="Ask anything about research. Knos answers with what is proved, by which test locked on NEAR testnet, and what is behind it.">
<meta property="og:url" content="https://drexthealpha.github.io/Knos/">
<meta property="og:image" content="https://drexthealpha.github.io/Knos/brand/card.png">
<meta name="twitter:card" content="summary_large_image">
<script>
// an old address: the one page's NEAR section is prove/, its IRIS section labs/; the check of a pull request has its
// own page, and every other old page is in app.html
(() => { const go = () => { const h = location.hash, name = h.slice(1).split("=")[0];
  if (/^(near|near-flow|who)$/.test(name)) location.replace("prove/");
  else if (name === "iris") location.replace("labs/");
  else if (/^check(-a-pull-request)?$/.test(name)) location.replace("check/" + (h.startsWith("#check=") && h.length > 7 ? h : ""));
  else if (/^(install|claim)$/.test(name)) location.replace("check/" + h);   // the Colosseum entry's install and pay steps
  else if (name && !/^(home|k-q)$/.test(name)) location.replace("app.html" + h); };
  go(); addEventListener("hashchange", go); })();
</script>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="brand/tokens.css">
<style>
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 17px/1.5 var(--text); }
a { color: var(--accent); }
.kh { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; max-width: 760px; margin: 0 auto; padding: 8px 16px; }
.kh .logo { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; margin-right: auto; color: var(--ink); text-decoration: none; font: 600 20px/1 var(--head); }
.kh .mark { display: block; width: 28px; height: 27px; background: currentColor; -webkit-mask: var(--m) center / contain no-repeat; mask: var(--m) center / contain no-repeat; }
.kh nav { display: flex; flex-wrap: wrap; }
.kh nav a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 10px; color: var(--ink); text-decoration: none; font-size: 16px; }
.kh nav a:hover, .kh nav a[aria-current] { text-decoration: underline; }
main { max-width: 760px; margin: 0 auto; padding: 0 16px; }
.door { min-height: calc(100svh - 76px); padding: 4vh 0 24px; box-sizing: border-box; }
.q { margin: 0 0 10px; color: var(--ink-2); }
.cost { margin: 14px 0 0; }
h1 { font: 600 clamp(28px, 6vw, 44px)/1.15 var(--head); letter-spacing: -.02em; margin: 0 0 16px; }
form { display: flex; flex-wrap: wrap; gap: 8px; }
label.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
input { flex: 1 1 260px; min-height: 52px; box-sizing: border-box; padding: 0 14px; font: 400 17px var(--text); color: var(--ink); background: var(--paper-2);
  border: 2px solid var(--ink-2); border-radius: 10px; }
input:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button { min-height: 52px; padding: 0 22px; font: 600 17px var(--text); border-radius: 10px; cursor: pointer; }
.go { flex: 0 0 auto; background: var(--accent); color: var(--accent-fg); border: 2px solid var(--accent); }
.go[disabled] { opacity: .75; cursor: progress; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.chips button { min-height: 44px; padding: 0 14px; background: transparent; color: var(--ink); border: 2px solid var(--line); font: 500 16px var(--text); }
.sample { margin-top: 10px; background: transparent; color: var(--ink); border: 2px solid var(--line); font-weight: 500; width: 100%; text-align: left; }
.out { margin-top: 16px; min-height: 1.5em; }
.out .verdict { font: 600 24px/1.25 var(--head); margin: 0 0 6px; }
.out .near { margin: 0 0 4px; color: var(--muted, #555); }
.out p { margin: 0 0 8px; }
.out .next { display: inline-flex; align-items: center; min-height: 48px; padding: 0 18px; border-radius: 10px; background: var(--accent); color: var(--accent-fg); text-decoration: none; font-weight: 600; }
.below { border-top: 1px solid var(--line); padding: 24px 0 8px; }
.below p { margin: 0 0 12px; }
footer { max-width: 760px; margin: 0 auto; padding: 16px; color: var(--ink-2); font-size: 16px; }
footer a { color: var(--ink-2); display: inline-flex; align-items: center; justify-content: center; min-height: 44px; min-width: 44px; margin-right: 12px; }
</style>
</head>
<body>
<header class="kh" id="kh">
  <a class="logo" href="./"><span class="mark" aria-hidden="true" style="--m: url(brand/mark.svg)"></span>Knos</a>
  <nav aria-label="Pages"><a href="prove/">Prove</a><a href="labs/">For labs</a></nav>
</header>
<main>
  <section class="door" aria-label="Ask about research">
    <p class="q">Why does research take 17 years to reach people? Checking it is costly (<a href="https://doi.org/10.1258/jrsm.2011.110180">Morris, 2011</a>).</p>
    <h1>Ask anything about research</h1>
    <form id="ask">
      <label class="sr" for="paper">Your question</label>
      <input id="paper" name="paper" placeholder="A question, a claim, a link or a paper" autocomplete="off" spellcheck="false">
      <button class="go" id="go" type="submit">Ask</button>
    </form>
    <button class="sample" id="sample" type="button">Try: HyperLogLog</button>
    <div class="chips" id="mine" hidden></div>
    <div class="out" id="out" aria-live="polite"></div>
    <p class="cost">By hand: $330 to $763 (<a href="https://labordynamicsinstitute.github.io/crress-book/">Colliard, 2023</a>). Knos: a minute.</p>
  </section>
  <p id="count" class="fine">Reading NEAR testnet...</p>
</main>
<footer>
  <span>Test money, no customers yet. <a href="https://hack.sibyllabs.org/leaderboard">1st of 92, Sibyl Labs Hackathon</a>.</span><br>
  <a href="https://github.com/drexthealpha/Knos">Source</a><a href="status/">Status</a>
</footer>
<script>
(() => {
  const HOSTED = "https://knos.onrender.com";
  const CLAIMS = /*CLAIMS*/[]/*END*/;   // the claims registry, written at build time by scripts/site_pages.py
  const $ = (id) => document.getElementById(id), out = $("out");
  const el = (tag, props, kids) => { const n = Object.assign(document.createElement(tag), props || {}); (kids || []).forEach((k) => k != null && n.append(k)); return n; };
  const link = (href, text, cls) => el("a", { href, textContent: text, className: cls || "", target: href.startsWith("http") ? "_blank" : "", rel: "noopener" });
  const json = (u, opt) => fetch(u, opt).then((r) => r.ok ? r.json() : null).catch(() => null);
  // the state of every claim: the site's own file at once, then the live server
  let board = null;
  const boardFile = json("data/board.json").then((b) => { if (b && b.claims && !board) board = b; });
  json(HOSTED + "/api/near/claims").then((b) => { if (b && b.claims) board = b; });
  // the visitor's own questions, in this browser only
  const KEY = "knos.memory";
  const mem = (() => { try { return JSON.parse(localStorage.getItem(KEY) || "{}"); } catch { return {}; } })();
  const remember = (q, name) => { try { mem.asked = [{ q, name, at: Date.now() }, ...(mem.asked || []).filter((x) => x.q !== q)].slice(0, 5); localStorage.setItem(KEY, JSON.stringify(mem)); } catch { /* no storage */ } };
  const words = (s) => String(s || "").toLowerCase().normalize("NFKD").replace(/[^a-z0-9.]+/g, " ").split(" ").filter((w) => w.length > 2);
  const STOP = new Set(words("the and for with does what how can are was this that from into its claim paper papers research about"));
  function match(text) {
    const s = text.trim(), id = s.toLowerCase().replace(/^https?:\/\/(dx\.)?doi\.org\//, "").replace(/^doi:/, "").replace(/^https?:\/\/arxiv\.org\/(abs|pdf)\//, "arxiv:").replace(/v\d+$/, "");
    for (const c of CLAIMS) if ((c.doi && id === c.doi.toLowerCase()) || (c.arxiv && id === "arxiv:" + c.arxiv)) return { c, by: "paper" };
    if (/^https?:|^10\.\d|^arxiv:/i.test(s)) return null;   // a paper Knos has no claim for: the server says what a check would cost
    const q = new Set(words(s).filter((w) => !STOP.has(w)));
    let best = null, top = 0;
    for (const c of CLAIMS) { const k = new Set(words([c.name.replace(/-/g, " "), c.plain, c.quote, c.paper, c.authors].join(" "))), name = new Set(words(c.name.replace(/-/g, " ")));
      let n = 0; for (const w of q) if (k.has(w)) n += name.has(w) ? 2 : 1;   // the claim's own name counts double
      if (n > top) { top = n; best = c; } }
    if (top < 2) return { none: true };
    // a word or number of the question that the claim does not have: the answer is the closest proved claim, not a yes to the question
    const own = new Set(words([best.name.replace(/-/g, " "), best.plain, best.quote, best.paper].join(" "))), key = words(best.name.split("-")[0])[0], miss = [...q].filter((w) => !own.has(w) && (w.length > 3 || /\d/.test(w)));
    return { c: best, by: "words", near: miss.length > 0 || (key && !q.has(key)) };   // one shared word ("memory") is not a match
  }
  function answer(c, live, near) {
    const m = (board && board.claims && board.claims[c.name]) || {}, last = live || m.last_proof && { holds: true, job: m.last_proof };
    const holds = last ? last.holds !== false : null, out7 = m.demand && m.demand.behind_usd != null ? +m.demand.behind_usd : null,
      behind = out7 != null ? `${out7.toFixed(2)} test USDC from outside backers this week` : "";
    out.replaceChildren(
      ...(near ? [el("p", { className: "near", textContent: "Not proved yet as asked. The closest claim Knos proved:" })] : []),
      el("p", { className: "verdict", textContent: holds === true ? (near ? "It holds" : "Yes, the claim holds") : holds === false ? "No, the claim fails" : "Not proved yet" }),
      el("p", {}, [`${c.plain.replace(/.$/, "")}. ${c.authors}, ${c.year}. `, holds != null && last.job ? "Proved by its locked test " : "Its locked test is ", link(`https://github.com/drexthealpha/Knos/blob/main/near/agents/job/${c.test}`, c.test),
        ` (sha256 ${c.sha256.slice(0, 8)}...)`, holds != null && last.job ? [", ", link(last.record || `claim/${c.name}/`, last.job)] : "", ". ", behind ? behind + "." : ""].flat()),
      el("p", {}, [link("prove/#paper=" + encodeURIComponent(c.doi ? "https://doi.org/" + c.doi : c.arxiv ? "https://arxiv.org/abs/" + c.arxiv : ""), "Prove it yourself", "next"), " ", link(`claim/${c.name}/`, "The claim")]));
  }
  function none(text) {
    out.replaceChildren(el("p", { className: "verdict", textContent: "Nothing proved matches yet" }),
      el("p", { textContent: `Knos has proved ${CLAIMS.length} claims on NEAR testnet; none is about "${text.slice(0, 60)}". Ask about one of them, or paste a paper's link.` }),
      el("p", {}, CLAIMS.map((c) => el("button", { type: "button", className: "sample", textContent: c.plain, onclick: () => ask(c.plain, true) }))));
  }
  let asked = 0;   // only the newest question's answer is shown: a slow answer to an earlier one is dropped
  async function ask(text, exact) {
    $("paper").value = text;
    const go = $("go"), t0 = performance.now(), m = match(text), mine = ++asked;
    if (m && m.c) {
      remember(text, m.c.name);
      if (!board) { out.replaceChildren(el("p", { textContent: "Reading NEAR testnet..." })); await Promise.race([boardFile, new Promise((res) => setTimeout(res, 1500))]); }
      if (mine !== asked) return;
      if (board && board.claims) { answer(m.c, null, m.near && !exact); return; }   // the site's own board file, or else the server's last proof of this claim
      const r = await json(HOSTED + "/api/near/claim/look", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ url: m.c.doi ? "https://doi.org/" + m.c.doi : "https://arxiv.org/abs/" + m.c.arxiv }) });
      if (mine === asked) answer(m.c, r && r.last, m.near && !exact);
      return;
    }
    if (m && m.none) { remember(text, ""); none(text); return; }
    go.disabled = true; $("sample").disabled = true;
    const p = el("p", { textContent: "Reading the paper... 0.0 s" }); out.replaceChildren(p);
    const tick = setInterval(() => { p.textContent = `Reading the paper... ${((performance.now() - t0) / 1000).toFixed(1)} s`; }, 100);
    const r = await json(HOSTED + "/api/near/claim/look", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ url: text }) });
    clearInterval(tick); go.disabled = false; $("sample").disabled = false;
    if (mine !== asked) return;
    if (!r || !r.ok) { out.replaceChildren(el("p", { className: "verdict", textContent: "Not read" }), el("p", {}, [`Knos's server did not answer, so the paper was not read. It may be waking up. `, el("button", { type: "button", className: "go", textContent: "Try again", onclick: () => ask(text) })])); return; }
    if (r.known) { const c = CLAIMS.find((x) => x.name === r.name); if (c) { remember(text, c.name); answer(c, r.last); return; } }
    const q = r.quote || {};
    remember(text, "");
    out.replaceChildren(el("p", { className: "verdict", textContent: "Knos cannot prove this paper yet" }),
      el("p", { textContent: `${r.title ? r.title + ". " : ""}Today a person checks it: ${q.checker || "someone who reruns it"}. Price: ${q.price || "not published"}. Time: ${q.time || "not published"}.` }),
      el("p", {}, [link(q.source || "prove/", "Source")]));
  }
  $("ask").addEventListener("submit", (e) => { e.preventDefault(); const v = $("paper").value.trim(); if (!v) { $("sample").click(); return; } ask(v); });
  $("sample").addEventListener("click", () => ask("Does HyperLogLog count 30,000 visitors in 1.5 KB?", true));
  // a second visit starts where the first ended: the visitor's last questions, from this browser
  if ((mem.asked || []).length) { $("mine").hidden = false; $("mine").replaceChildren(...mem.asked.slice(0, 3).map((x) => el("button", { type: "button", textContent: x.q.slice(0, 40), onclick: () => ask(x.q) }))); }
  const counts = (c) => { if (c && c.proofs) $("count").textContent = `${c.proofs.toLocaleString("en-US")} proofs paid.`; };
  json("data/counters.json").then(counts);
  json(HOSTED + "/api/near/claim/counters").then((c) => c ? counts(c) : $("count").textContent.startsWith("Reading") && ($("count").textContent = "NEAR testnet's record could not be read just now."));
})();
</script>
</body>
</html>
